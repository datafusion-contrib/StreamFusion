site_name: StreamFusion
site_description: Run Apache Flink SQL faster with a native Rust + Apache Arrow/DataFusion accelerator.
site_url: https://streamfusion.tech/
repo_url: https://github.com/datafusion-contrib/StreamFusion
repo_name: datafusion-contrib/StreamFusion
edit_uri: edit/main/docs/
docs_dir: docs

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.action.edit
    - toc.follow
    - search.suggest

markdown_extensions:
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/datafusion-contrib/StreamFusion
      name: GitHub
    - icon: fontawesome/brands/discord
      link: https://discord.gg/gCKHfb96Q
      name: Discord

