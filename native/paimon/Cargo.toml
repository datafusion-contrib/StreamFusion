[package]
name = "streamfusion-paimon"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
streamfusion-bridge = { path = "../bridge" }
arrow.workspace = true
jni.workspace = true
paimon = { version = "=0.4.0", default-features = false }
opendal = { version = "0.58.0", default-features = false }
async-trait = "0.1"
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dependencies.libmimalloc-sys]
workspace = true
optional = true

[build-dependencies]
streamfusion-native-build = { path = "../native-build" }

[features]
default = []
mimalloc = ["dep:libmimalloc-sys", "libmimalloc-sys/v2"]
