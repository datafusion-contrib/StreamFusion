[package]
name = "streamfusion"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64.workspace = true
streamfusion-bridge = { path = "../bridge" }
arrow = { workspace = true, features = ["json"] }
arrow-ord.workspace = true
jni.workspace = true
datafusion.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
regex.workspace = true
md-5.workspace = true
sha2.workspace = true
sha1.workspace = true
log.workspace = true
num-bigint.workspace = true
num-traits.workspace = true
tokio.workspace = true
futures.workspace = true
ahash.workspace = true
memchr.workspace = true
serde.workspace = true
serde_json.workspace = true
simd-json.workspace = true
stacker = "0.1.24"
zstd = "0.13"
lz4_flex = "0.13"
lzokay = "2.0.1"

[dependencies.libmimalloc-sys]
workspace = true
optional = true

[build-dependencies]
streamfusion-native-build = { path = "../native-build" }

[features]
default = ["rocksdb-state"]
mimalloc = ["dep:libmimalloc-sys", "libmimalloc-sys/v2"]
rocksdb-state = ["dep:rocksdb", "dep:bytes"]

[dependencies.rocksdb]
workspace = true
optional = true

[dependencies.bytes]
workspace = true
optional = true

[dev-dependencies]
jni = { workspace = true, features = ["invocation"] }
tempfile = "3"
criterion.workspace = true
streamfusion-benchmark-support.workspace = true
bytes = "1"

[[bench]]
name = "operators"
harness = false

[[bench]]
name = "scalar_functions"
harness = false

[[bench]]
name = "calc_selection"
harness = false

[[bench]]
name = "data_movement"
harness = false

[[bench]]
name = "scalar_registry"
harness = false

[[bench]]
name = "keys_and_checkpoints"
harness = false

[[bench]]
name = "operator_allocations"
harness = false

[[bench]]
name = "persistent_state"
harness = false
required-features = ["rocksdb-state"]

[[bench]]
name = "calc_expressions"
harness = false

[[bench]]
name = "binary_expressions"
harness = false

[[bench]]
name = "collection_expressions"
harness = false

