[workspace]
resolver = "2"
members = [
  "engine",
  "bridge",
  "native-build",
  "format-support",
  "kafka",
  "json",
  "csv",
  "raw",
  "avro",
  "protobuf",
  "parquet",
  "integration-tests",
]

[workspace.package]
version = "0.1.0-rc2"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
jni = "0.21"
arrow = { version = "58", default-features = false, features = ["ffi"] }
# Custom timestamp formatting (DATE_FORMAT) with a translated strftime pattern. Already in the tree
# transitively via arrow; pinned here for direct use.
chrono = "0.4"
# Session-zone conversion for DATE_FORMAT/EXTRACT over TIMESTAMP_LTZ, opt-in behind allowIncompatible
# (the default LTZ path is a JVM upcall to Flink's own datetime code). chrono-tz bundles the IANA tz
# database; it can diverge from the JVM's tzdb at edges (version skew, >~2100 DST, deep history) — the
# reason it's gated. Same crate DataFusion Comet uses for Spark's zone-aware temporal functions.
chrono-tz = "0.10"
# REGEXP_EXTRACT (opt-in, allowIncompatible): Rust's regex engine differs from Java's, so the JVM
# encoder gates it. Already in the tree transitively via datafusion; pinned here for direct use.
regex = "1"
# The same released digest implementations used by DataFusion, with hex written directly to Arrow.
md-5 = "0.11"
sha2 = "0.11"
sha1 = "0.11"
# The logging facade the whole native tree (including DataFusion) emits through; the
# JNI_OnLoad-installed bridge forwards it to the host's SLF4J. Already in the tree transitively;
# pinned here for direct use.
log = "0.4"
# Byte-exact decimal division/modulo: emulating BigDecimal.divide's round-to-38-significant-digits
# intermediate needs integers wider than i128/i256 in the worst case. Already in the tree
# transitively via datafusion; pinned here for direct use.
num-bigint = "0.4"
# Native Parquet sink encoding and test-fixture decoding.
parquet = { version = "58", features = ["arrow"] }
# Native Avro decode incl. the Confluent Schema Registry wire format (magic byte + 4-byte schema id +
# Avro body), resolved against a local SchemaStore keyed by integer id. Used by the Kafka source.
arrow-avro = "58"
# Native Protobuf decode. Flink's `protobuf` format carries the BARE protobuf message bytes (no
# Confluent framing) decoded against a descriptor from a generated message class. The owned reader
# converts the protobuf wire format STRAIGHT into Arrow arrays (no per-row DynamicMessage), driven by
# a runtime `MessageDescriptor` — exactly Flink's dynamic model. prost-reflect builds that descriptor
# from a FileDescriptorSet the JVM serializes off the message class.
prost-reflect = "0.16"
# Manipulate the FileDescriptorSet to prune it to the read fields (projection pushdown into the decode):
# match prost-reflect 0.16's prost (0.14) so the encoded set is interchangeable.
prost = "0.14"
prost-types = "0.14"
# Keep DataFusion's expression/physical-plan surface in core.
datafusion = { version = "54.0.0", default-features = false, features = [
  "nested_expressions",
  "crypto_expressions",
  "datetime_expressions",
  "encoding_expressions",
  "regex_expressions",
  "string_expressions",
  "unicode_expressions",
  "compression",
  "recursive_protection",
  "sql",
] }
tokio = { version = "1", features = ["rt-multi-thread"] }
futures = "0.3"
# Fast hashing for the per-row grouping map (the same hasher arrow/datafusion use internally).
ahash = "0.8"
# SIMD stage-1 JSON parse for the Kafka JSON/CDC decode: the tape walk into Arrow builders replaces
# arrow-json's scalar tokenizer on the hot ingest edge (RisingWave uses the same parser family).
# Runtime CPU detection on x86, NEON on aarch64 — nothing machine-specific in the build.
simd-json = "0.17"
# CSV record splitting for the Kafka CSV decode (delimiter/quote/escape/comment handling). arrow-csv's
# reader has a fixed value envelope (empty→null, truncating decimals, no trimming) that can't be
# configured into Flink's, so the decode splits records with csv-core and converts each field with the
# Flink-exact text parsers instead. Already in the tree transitively via arrow-csv.
csv-core = "0.1"
# NumCast for the JSON number → Arrow primitive conversions, mirroring arrow-json's number path.
# Already in the tree transitively via arrow; pinned here for direct use.
num-traits = "0.2"
# Flink's JSON format writes binary values as RFC 4648 base64 rather than arrow-json's hexadecimal.
base64 = "0.22"
# Reusable literal substring search, matching DataFusion's strpos kernel.
memchr = "2"
# StreamFusion state is owned by Rust and talks to RocksDB through its native C API. Version 0.22
# builds RocksDB 8.10.0, matching the RocksDB release used by Flink 2.2.1. Keep the dependency
# statically linked into the StreamFusion DSO; the production link uses hidden visibility so it can
# coexist with Flink's frocksdbjni in jobs containing host-side fallback operators.
rocksdb = { version = "0.22.0", default-features = false, features = ["snappy", "lz4", "zstd"] }
# Checkpoint manifests and the borrowed string lexer used by SQL/JSON scalar functions.
serde = { version = "1", features = ["derive"] }
# Also parses Avro writer schemas for the decode framing walk; in the tree via arrow-avro anyway.
serde_json = "1"
bytes = { version = "1" }
# Each cdylib opts in through its `mimalloc` feature and pins the v2 branch: v3's lazy thread
# initialization can crash when a JVM-created thread first allocates through the library.
# native-build supplies library-local aliases; the hosting JVM keeps its own allocator.
libmimalloc-sys = { version = "0.1" }

[profile.release]
# Keep engine hot loops in one codegen unit for stable inlining and benchmark results.
codegen-units = 1
