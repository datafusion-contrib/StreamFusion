[package]
name = "streamfusion-iceberg"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
streamfusion-bridge = { path = "../bridge" }
arrow.workspace = true
parquet.workspace = true
jni.workspace = true
# Temporary official RC pin authorized for V3 reads; replace with the registry release.
iceberg = { git = "https://github.com/apache/iceberg-rust.git", tag = "v0.11.0-rc.3" }
async-trait = "0.1"
bytes.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
typetag = "0.2"
datafusion-common = "54.0.0"
datafusion-execution = "54.0.0"
datafusion-functions = { version = "54.0.0", default-features = false }
datafusion-physical-expr = "54.0.0"
datafusion-physical-plan = "54.0.0"

[dependencies.libmimalloc-sys]
workspace = true
optional = true

[build-dependencies]
streamfusion-native-build = { path = "../native-build" }

[features]
default = []
mimalloc = ["dep:libmimalloc-sys", "libmimalloc-sys/v2"]

[dev-dependencies]
criterion.workspace = true
streamfusion-benchmark-support.workspace = true

[[bench]]
name = "iceberg_io"
harness = false
