name: CI
run-name: CI (canonical ${{ inputs.canonical_coverage || 'representative' }})

on:
  push:
    branches: ['main', 'ci/**']
  workflow_dispatch:
    inputs:
      canonical_coverage:
        description: Canonical savepoint coverage (full is an explicit exhaustive qualification)
        type: choice
        options: [representative, full]
        default: representative

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  plan:
    name: Coverage plan
    if: ${{ github.repository != 'datafusion-contrib/StreamFusion' || github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/ci-plan.yml

  test-suites:
    name: Test suites
    needs: plan
    if: needs.plan.outputs.tests == 'true'
    uses: ./.github/workflows/ci-test-suites.yml
    with:
      canonical_coverage: ${{ inputs.canonical_coverage || 'representative' }}

  all-tests:
    name: All CI tests
    if: ${{ (always() && !cancelled()) && (github.repository != 'datafusion-contrib/StreamFusion' || github.ref == 'refs/heads/main') }}
    needs: [plan, test-suites]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every test job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          REUSED_COVERAGE: ${{ needs.plan.outputs.tests == 'false' }}
        run: |
          jq -e --arg reused "$REUSED_COVERAGE" '
            .plan.result == "success" and
            if $reused == "true" then
              all(to_entries[]; .key == "plan" or .value.result == "skipped")
            else
              all(.[]; .result == "success")
            end
          ' <<< "$NEEDS_JSON"
