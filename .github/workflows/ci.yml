name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUST_BACKTRACE: "1"

jobs:
  native-tests:
    name: Rust tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@1.94.0

      # Keyed on Cargo.lock; also disables incremental compilation, which keeps the
      # debug target directory a fraction of a local dev build's size.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Run native test suite
        working-directory: native
        run: cargo test --features kafka,parquet,rocksdb-state

      - name: Check native formatting
        working-directory: native
        run: cargo fmt --all -- --check

  java-tests:
    name: Java tests (debug native build)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v6

      # A cold debug build of the native library (DataFusion + Arrow) plus the
      # Maven repository outgrows the runner's default free
      # space; drop the preinstalled toolchains we never touch.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          df -h /

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - uses: dtolnay/rust-toolchain@1.94.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      # Builds the debug native library through the Maven exec hook, then runs the
      # full JUnit suite. The Kafka decode harnesses use Testcontainers, which the
      # hosted runners' preinstalled Docker daemon serves directly.
      - name: Run Java test suite
        run: mvn -B -ntp test

  image-integration:
    name: Flink image integration (optimized native build)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      # The release native payload, Maven repository, and Docker image need more than the runner's
      # default free space. This is intentionally the same cleanup as the Java test jobs.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          df -h /

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - uses: dtolnay/rust-toolchain@1.94.0

      # The host release builder compiles the optional Fluss DSO before it invokes the
      # cross-platform Docker builder. fluss-rs generates protobuf RPC bindings at build time.
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      # Host-only is still a production Linux/x86_64 release (including mimalloc); cross-platform
      # manifest assembly is covered by the release builder, but does not belong on this smoke path.
      - name: Build optimized core image
        run: |
          bin/build-release.sh --host-only
          version="$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)"
          jar tf "streamfusion-kafka/target/streamfusion-kafka-${version}.jar" | grep -q 'native/kafka/linux/x86_64/libstreamfusion_kafka.so'
          jar tf "streamfusion-json/target/streamfusion-json-${version}.jar" | grep -q 'native/json/linux/x86_64/libstreamfusion_json.so'
          jar tf "streamfusion-csv/target/streamfusion-csv-${version}.jar" | grep -q 'native/csv/linux/x86_64/libstreamfusion_csv.so'
          jar tf "streamfusion-raw/target/streamfusion-raw-${version}.jar" | grep -q 'native/raw/linux/x86_64/libstreamfusion_raw.so'
          jar tf "streamfusion-avro/target/streamfusion-avro-${version}.jar" | grep -q 'native/avro/linux/x86_64/libstreamfusion_avro.so'
          ! jar tf "streamfusion-avro-confluent-registry/target/streamfusion-avro-confluent-registry-${version}.jar" | grep -q 'libstreamfusion_avro'
          jar tf "streamfusion-protobuf/target/streamfusion-protobuf-${version}.jar" | grep -q 'native/protobuf/linux/x86_64/libstreamfusion_protobuf.so'
          jar tf "streamfusion-fluss/target/streamfusion-fluss-${version}.jar" | grep -q 'native/fluss/linux/x86_64/libstreamfusion_fluss.so'
          jar tf "streamfusion-parquet/target/streamfusion-parquet-${version}.jar" | grep -q 'native/parquet/linux/x86_64/libstreamfusion_parquet.so'
          bin/check-artifacts.sh --host-only
          bin/build-flink-image.sh --tag streamfusion-flink:image-it --load --skip-release-build

      - name: Run Flink Session-cluster image smoke test
        run: >
          mvn -B -ntp -Pimage-it -pl :streamfusion-image-it verify
          -Dstreamfusion.image.name=streamfusion-flink:image-it

  module-tests:
    name: ${{ matrix.name }} module tests (debug native build)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Kafka
            # Matches the shipped connector DSO's feature set (docker/native-release.Dockerfile):
            # sink encode arms for natively encoded formats live in the kafka library.
            tag: streamfusion-kafka
            features: kafka,csv,avro,protobuf,raw
            protoc: false
            native-tests: false
          - name: JSON
            tag: streamfusion-json
            features: json
            protoc: false
            native-tests: false
          - name: CSV
            tag: streamfusion-csv
            features: csv
            protoc: false
            native-tests: false
          - name: RAW
            tag: streamfusion-raw
            features: raw
            protoc: false
            native-tests: false
          - name: Avro
            tag: streamfusion-avro
            features: avro
            protoc: false
            native-tests: false
          - name: Avro Confluent Registry
            tag: streamfusion-avro-confluent
            features: avro
            protoc: false
            native-tests: false
          - name: Protobuf
            tag: streamfusion-protobuf
            features: protobuf
            protoc: false
            native-tests: false
          - name: Parquet
            tag: streamfusion-parquet
            features: parquet
            protoc: false
            native-tests: false
          - name: Fluss
            tag: streamfusion-fluss
            features: fluss,parquet
            protoc: true
            native-tests: true
    steps:
      - uses: actions/checkout@v6

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          df -h /

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - uses: dtolnay/rust-toolchain@1.94.0

      - name: Install protoc
        if: matrix.protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Run native test suite
        if: matrix.native-tests
        working-directory: native
        run: cargo test --features fluss,parquet

      - name: Run tagged Java module suite
        run: >
          mvn -B -ntp -pl :streamfusion-runtime test
          -Dnative.cargo.args="build --features ${{ matrix.features }}"
          -Dgroups="${{ matrix.tag }}"
