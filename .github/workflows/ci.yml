name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUST_BACKTRACE: "1"

jobs:
  native-tests:
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    name: Rust tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@1.94.0

      # Keyed on Cargo.lock; also disables incremental compilation, which keeps the
      # debug target directory a fraction of a local dev build's size.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run native test suite
        working-directory: native
        run: cargo test --workspace

      - name: Check native package boundaries
        run: python3 bin/check-native-workspace.py

      - name: Check native formatting
        working-directory: native
        run: cargo fmt --all -- --check

  java-tests:
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    name: Java tests (debug native build)${{ matrix.suffix }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - line: '2.2'
            profile: ''
            suffix: ''
          - line: '1.18'
            profile: '-Pflink-1.18'
            suffix: ' (Flink 1.18)'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v6

      - name: Free disk space
        run: python3 bin/ci-free-disk.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Test upstream execution evidence checks
        run: |
          mvn -B -ntp -f dev/flink-suite/agent/pom.xml package
          python3 -m unittest discover -s dev/flink-suite -p 'test_*.py'
          python3 -m unittest discover -s bin -p 'test_check_flink_suite_classpath.py'
          python3 -m unittest discover -s bin -p 'test_check_native_glibc.py'
          python3 -m unittest discover -s bin -p 'test_check_native_tls.py'
          python3 -m unittest discover -s bin -p 'test_ci_free_disk.py'
          python3 -m unittest discover -s bin -p 'test_ci_module_groups.py'

      - name: Test Flink 1.18 native and fallback contract selection
        if: matrix.line == '1.18'
        run: |
          mvn -B -ntp -f dev/flink-suite/agent/pom.xml -Dstreamfusion.flink-suite.flink-line=1.18 test
          mvn -B -ntp -f dev/flink-suite/agent/pom.xml -Dstreamfusion.flink-suite.flink-line=1.18 -Dstreamfusion.flink-suite.native-rocksdb=true test

      - uses: dtolnay/rust-toolchain@1.94.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          shared-key: debug-jvm
          save-if: false

      # Builds the debug native library through the Maven exec hook, then runs the
      # full JUnit suite. The Kafka decode harnesses use Testcontainers, which the
      # hosted runners' preinstalled Docker daemon serves directly.
      - name: Run Java test suite
        run: mvn -B -ntp ${{ matrix.profile }} test

      - name: Upload Java failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: java-failure-diagnostics-${{ matrix.line }}
          path: |
            **/surefire-reports/*.xml
            **/surefire-reports/*.txt
            **/surefire-reports/*.dump
            **/surefire-reports/*.dumpstream
            **/hs_err_pid*.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload portable SQL audit outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portable-sql-audit-${{ matrix.line }}
          path: streamfusion-runtime/target/sql-audit/*.json
          if-no-files-found: error

      - name: Verify native JNI exports
        run: python3 bin/check-native-workspace.py --libraries native/target/debug

  lake-module-tests:
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    name: ${{ matrix.name }} tests (debug native build)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Delta
            profile: delta
            module: streamfusion-delta
          - name: Paimon Parquet
            profile: paimon
            module: streamfusion-paimon
            format: parquet
          - name: Paimon ORC
            profile: paimon
            module: streamfusion-paimon
            format: orc
          - name: Paimon Parquet (Flink 1.18)
            profile: paimon,flink-1.18
            module: streamfusion-paimon
            format: parquet
          - name: Paimon ORC (Flink 1.18)
            profile: paimon,flink-1.18
            module: streamfusion-paimon
            format: orc
    steps:
      - uses: actions/checkout@v6

      - name: Free disk space
        run: python3 bin/ci-free-disk.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - uses: dtolnay/rust-toolchain@1.94.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          shared-key: debug-jvm
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.profile == 'paimon' && matrix.format == 'orc' }}

      - name: Run optional lake module suite
        env:
          SF_PAIMON_FILE_FORMAT: ${{ matrix.format || 'parquet' }}
        run: >
          mvn -B -ntp -P${{ matrix.profile }}
          -pl ${{ matrix.module }} -am test -Dsf.runtime.tests.skip=true

  image-integration:
    name: Flink image integration (optimized native build)${{ matrix.suffix }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - line: '2.2'
            profile: image-it
            suffix: ''
          - line: '1.18'
            profile: image-it,flink-1.18
            suffix: ' (Flink 1.18)'
    steps:
      - uses: actions/checkout@v6

      - name: Free disk space
        run: python3 bin/ci-free-disk.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - uses: dtolnay/rust-toolchain@1.94.0

      - uses: Swatinem/rust-cache@v2
        with:
          key: ubuntu-22.04-glibc-2.35
          workspaces: native -> target/release-staging
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Host-only is still a production Linux/x86_64 release (including mimalloc); cross-platform
      # manifest assembly is covered by the release builder, but does not belong on this smoke path.
      - name: Build optimized core image
        env:
          FLINK_LINE: ${{ matrix.line }}
        run: |
          bin/build-release.sh --host-only --flink-line "$FLINK_LINE"
          bin/check-artifacts.sh --host-only --flink-line "$FLINK_LINE"
          bin/build-flink-image.sh --flink-line "$FLINK_LINE" --tag streamfusion-flink:image-it --load --skip-release-build

      - name: Run Flink Session-cluster image smoke test
        run: >
          mvn -B -ntp -P${{ matrix.profile }} -pl streamfusion-image-it verify
          -Dstreamfusion.image.name=streamfusion-flink:image-it

      - name: Package qualified Flink 1.18 payloads
        if: matrix.line == '1.18'
        run: bin/package-release.sh --flink-line 1.18

      - name: Execute the packaged loader and mixed-line identity tests
        if: matrix.line == '1.18'
        run: >
          mvn -B -ntp -Pflink-1.18,universal -pl streamfusion-loader -am test
          -Dtest=FlinkPayloadIdentityTest,StreamFusionPlannerLoaderTest
          -Dsurefire.failIfNoSpecifiedTests=false

      - uses: actions/upload-artifact@v4
        if: matrix.line == '1.18'
        with:
          name: flink1.18-optimized-linux-payloads
          path: target/release/streamfusion-flink1.18-*-bin.tar.gz*
          if-no-files-found: error

  module-tests:
    name: ${{ matrix.name }} module tests (debug native build)${{ matrix.suffix }}
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        line: ['2.2', '1.18']
        group: [kafka, formats, files]
        include:
          - line: '2.2'
            profile: ''
            suffix: ''
          - line: '1.18'
            profile: '-Pflink-1.18'
            suffix: ' (Flink 1.18)'
          - group: kafka
            name: Kafka
            packages: streamfusion-kafka
            tags: streamfusion-kafka
          - group: formats
            name: Row formats
            packages: streamfusion-json streamfusion-csv streamfusion-raw streamfusion-avro streamfusion-protobuf
            tags: streamfusion-json | streamfusion-csv | streamfusion-raw | streamfusion-avro | streamfusion-avro-confluent | streamfusion-protobuf
          - group: files
            name: Columnar formats
            packages: streamfusion-orc streamfusion-parquet
            tags: streamfusion-orc | streamfusion-parquet
    steps:
      - uses: actions/checkout@v6

      - name: Free disk space
        run: python3 bin/ci-free-disk.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - uses: dtolnay/rust-toolchain@1.94.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check every standalone native package
        env:
          NATIVE_PACKAGES: ${{ matrix.packages }}
        run: |
          status=0
          for package in $NATIVE_PACKAGES; do
            (cd native && cargo check -p "$package" --all-targets) || status=1
          done
          exit "$status"

      - name: Run tagged Java module suites
        env:
          TEST_GROUPS: ${{ matrix.tags }}
        run: >
          mvn -B -ntp ${{ matrix.profile }} -pl streamfusion-runtime test
          -Dgroups="$TEST_GROUPS"

  all-tests:
    name: All CI tests
    if: ${{ always() }}
    needs: [native-tests, java-tests, lake-module-tests, image-integration, module-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every test job to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: jq -e 'length > 0 and all(.[]; .result == "success")' <<< "$NEEDS_JSON"
