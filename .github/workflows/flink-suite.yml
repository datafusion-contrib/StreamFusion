name: Upstream Flink suite

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}
  schedule:
    - cron: "17 7 * * 1"

permissions:
  contents: read

concurrency:
  group: upstream-flink-suite-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  upstream-suite:
    name: ${{ matrix.suite }} suite
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        suite: [runtime, formats, parquet, orc, kafka, paimon, delta, state]
    steps:
      - uses: actions/checkout@v6

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          df -h /

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - uses: dtolnay/rust-toolchain@1.94.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native -> ../.flink-suite/streamfusion-source/native/target

      - name: Run unchanged upstream suite with StreamFusion
        run: |
          set -o pipefail
          bin/flink-suite.sh "${{ matrix.suite }}" 2>&1 | tee upstream-suite.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-flink-${{ matrix.suite }}-${{ github.sha }}
          path: |
            upstream-suite.log
            .flink-suite/native-execution/
            .flink-suite/diagnostics/
            .flink-suite/**/target/surefire-reports/
          include-hidden-files: true
          retention-days: 7

  legacy-delta-audit:
    name: Delta 3.3 / Flink 1.18 host audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run unchanged legacy Delta SQL tests against released Flink 1.18
        run: |
          set -o pipefail
          bin/delta-legacy-audit.sh 2>&1 | tee delta-legacy-audit.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: delta-legacy-flink118-${{ github.sha }}
          path: |
            delta-legacy-audit.log
            .flink-suite/delta-legacy-1.18/target/surefire-reports/
          include-hidden-files: true
          retention-days: 7

  all-tests:
    name: All upstream integration tests
    if: ${{ always() }}
    needs: [upstream-suite, legacy-delta-audit]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every upstream suite to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: jq -e 'length > 0 and all(.[]; .result == "success")' <<< "$NEEDS_JSON"
