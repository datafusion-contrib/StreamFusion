name: Upstream Flink suite

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch:
    inputs:
      sql_inventory:
        description: 'Record complete per-invocation SQL admission inventories'
        type: boolean
        default: false
      inventory_scope:
        description: 'Suites selected when sql_inventory is enabled'
        type: choice
        options: [runtime, connectors, all]
        default: runtime
  schedule:
    - cron: "17 7 * * 1"

permissions:
  contents: read

concurrency:
  group: upstream-flink-suite-${{ github.ref }}-${{ inputs.sql_inventory && inputs.inventory_scope || 'tests' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  suite-matrix:
    name: Select upstream suites
    runs-on: ubuntu-24.04
    outputs:
      suites: ${{ steps.select.outputs.suites }}
    steps:
      - uses: actions/checkout@v6
      - id: select
        env:
          INVENTORY: ${{ inputs.sql_inventory || false }}
          SCOPE: ${{ inputs.inventory_scope || 'all' }}
        run: |
          python3 dev/flink-suite/suite_matrix.py >> "$GITHUB_OUTPUT"

  prepare:
    name: Prepare upstream build (Flink ${{ matrix.line }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - line: '2.2'
            version: '2.2.1'
          - line: '1.18'
            version: '1.18.1'
    steps:
      - uses: actions/checkout@v6
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
      - uses: actions/setup-java@v4
        id: java
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Cache the isolated suite Maven repository
        uses: actions/cache@v4
        with:
          path: .flink-suite/${{ matrix.line }}/m2
          key: upstream-m2-${{ runner.os }}-${{ runner.arch }}-jdk17-${{ matrix.version }}-${{ hashFiles('**/pom.xml', 'dev/flink-suite/settings.xml', 'bin/flink-suite.sh') }}
          restore-keys: |
            upstream-m2-${{ runner.os }}-${{ runner.arch }}-jdk17-${{ matrix.version }}-
      - name: Cache the compiled pinned Flink checkout
        uses: actions/cache@v4
        with:
          path: .flink-suite/${{ matrix.line }}/flink-${{ matrix.version }}
          key: upstream-classes-ubuntu2404-${{ runner.arch }}-${{ steps.java.outputs.version }}-${{ matrix.version }}-${{ hashFiles('bin/flink-suite.sh', 'dev/flink-suite/settings.xml', '.github/workflows/flink-suite.yml') }}
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: upstream-suite
          workspaces: native -> ../.flink-suite/${{ matrix.line }}/streamfusion-source/native/target
      - name: Build Flink and StreamFusion once
        env:
          FLINK_VERSION: ${{ matrix.version }}
          FLINK_SUITE_BUILD_THREADS: 1C
        run: |
          set -o pipefail
          bin/flink-suite.sh prepare 2>&1 | tee upstream-prepare.log
          python3 dev/flink-suite/shared_build.py pack \
            --root ".flink-suite/${{ matrix.line }}" --version "${{ matrix.version }}" \
            --archive upstream-build.tar.zst
      - uses: actions/upload-artifact@v4
        with:
          name: upstream-build-${{ matrix.line }}-${{ github.sha }}
          path: upstream-build.tar.zst
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-prepare-${{ matrix.line }}-${{ github.sha }}
          path: |
            upstream-prepare.log
            .flink-suite/${{ matrix.line }}/runtime-shards.json
          include-hidden-files: true
          retention-days: 7

  upstream-suite:
    name: ${{ matrix.label }} suite (Flink ${{ matrix.line }})
    needs: [suite-matrix, prepare]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.suite-matrix.outputs.suites) }}
    steps:
      - uses: actions/checkout@v6
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/download-artifact@v5
        with:
          name: upstream-build-${{ matrix.line }}-${{ github.sha }}
      - name: Restore the shared build
        run: |
          python3 dev/flink-suite/shared_build.py restore \
            --root ".flink-suite/${{ matrix.line }}" --version "${{ matrix.version }}" \
            --archive upstream-build.tar.zst
          rm upstream-build.tar.zst
      - name: Run unchanged upstream suite with StreamFusion
        env:
          FLINK_VERSION: ${{ matrix.version }}
          SUITES: ${{ matrix.suites }}
          FLINK_SUITE_REUSE_COMMON_BUILD: 'true'
          FLINK_SUITE_SHARD: ${{ matrix.shard }}
          FLINK_SUITE_SQL_INVENTORY: ${{ inputs.sql_inventory || false }}
        run: |
          set -o pipefail
          suite_status=0
          for suite in $SUITES; do
            bin/flink-suite.sh "$suite" 2>&1 | tee "upstream-${suite}.log" || suite_status=1
          done
          exit "$suite_status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-flink-${{ matrix.line }}-${{ matrix.label }}-${{ github.sha }}
          path: |
            upstream-*.log
            .flink-suite/**/native-execution/
            .flink-suite/**/diagnostics/
            .flink-suite/**/sql-inventory/
            .flink-suite/**/target/surefire-reports/
          include-hidden-files: true
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: matrix.shard != ''
        with:
          name: runtime-coverage-${{ matrix.line }}-${{ matrix.shard }}
          path: |
            .flink-suite/${{ matrix.line }}/runtime-shards.json
            .flink-suite/${{ matrix.line }}/diagnostics/runtime/shard-coverage.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  legacy-delta-audit:
    if: ${{ !inputs.sql_inventory }}
    name: Delta 3.3 / Flink 1.18 host audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run unchanged legacy Delta SQL tests against released Flink 1.18
        run: |
          set -o pipefail
          bin/delta-legacy-audit.sh 2>&1 | tee delta-legacy-audit.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: delta-legacy-flink118-${{ github.sha }}
          path: |
            delta-legacy-audit.log
            .flink-suite/delta-legacy-1.18/target/surefire-reports/
          include-hidden-files: true
          retention-days: 7

  all-tests:
    name: All upstream integration tests
    if: ${{ always() }}
    needs: [suite-matrix, prepare, upstream-suite, legacy-delta-audit]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require every upstream suite to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          INVENTORY: ${{ inputs.sql_inventory || false }}
        run: |
          jq -e --arg inventory "$INVENTORY" '
            length > 0 and all(to_entries[];
              .value.result == "success" or
              ($inventory == "true" and .key == "legacy-delta-audit" and .value.result == "skipped"))
          ' <<< "$NEEDS_JSON"
      - uses: actions/checkout@v6
        if: ${{ !inputs.sql_inventory || inputs.inventory_scope != 'connectors' }}
      - uses: actions/download-artifact@v5
        if: ${{ !inputs.sql_inventory || inputs.inventory_scope != 'connectors' }}
        with:
          pattern: runtime-coverage-2.2-*
          path: runtime-coverage/2.2
      - uses: actions/download-artifact@v5
        if: ${{ !inputs.sql_inventory || inputs.inventory_scope != 'connectors' }}
        with:
          pattern: runtime-coverage-1.18-*
          path: runtime-coverage/1.18
      - name: Require every runtime shard and parameterized invocation on both lines
        if: ${{ !inputs.sql_inventory || inputs.inventory_scope != 'connectors' }}
        run: |
          for line in 2.2 1.18; do
            python3 dev/flink-suite/runtime_shards.py aggregate \
              --plan "runtime-coverage/$line/runtime-coverage-$line-1/runtime-shards.json" \
              --reports "runtime-coverage/$line"
          done
