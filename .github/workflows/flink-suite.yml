name: Upstream Flink suite

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch:
    inputs:
      sql_inventory:
        description: 'Record complete per-invocation SQL admission inventories'
        type: boolean
        default: false
      inventory_scope:
        description: 'Suites selected when sql_inventory is enabled'
        type: choice
        options: [runtime, connectors, all]
        default: runtime
  schedule:
    - cron: "17 7 * * 1"

permissions:
  contents: read

concurrency:
  group: upstream-flink-suite-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  suite-matrix:
    name: Select upstream suites
    runs-on: ubuntu-24.04
    outputs:
      suites: ${{ steps.select.outputs.suites }}
    steps:
      - id: select
        env:
          INVENTORY: ${{ inputs.sql_inventory || false }}
          SCOPE: ${{ inputs.inventory_scope || 'all' }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          suites = ['runtime', 'formats', 'parquet', 'orc', 'kafka', 'paimon', 'delta', 'state']
          if os.environ['INVENTORY'] == 'true':
              if os.environ['SCOPE'] == 'runtime':
                  suites = ['runtime']
              elif os.environ['SCOPE'] == 'connectors':
                  suites = ['formats', 'parquet', 'orc', 'kafka', 'paimon', 'delta']
          matrix = []
          for line, version in [('2.2', '2.2.1'), ('1.18', '1.18.1')]:
              for suite in suites:
                  if suite == 'delta' and line == '1.18':
                      continue
                  for shard in range(1, 5) if suite == 'runtime' else ['']:
                      label = f'{suite}-{shard}' if shard else suite
                      matrix.append(dict(line=line, version=version, suite=suite, shard=shard, label=label))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('suites=' + json.dumps({'include': matrix}) + '\n')
          PYTHON

  prepare:
    name: Prepare upstream build (Flink ${{ matrix.line }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - line: '2.2'
            version: '2.2.1'
          - line: '1.18'
            version: '1.18.1'
    steps:
      - uses: actions/checkout@v6
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Cache the isolated suite Maven repository
        uses: actions/cache@v4
        with:
          path: .flink-suite/${{ matrix.line }}/m2
          key: upstream-m2-${{ runner.os }}-${{ runner.arch }}-jdk17-${{ matrix.version }}-${{ hashFiles('**/pom.xml', 'dev/flink-suite/settings.xml', 'bin/flink-suite.sh') }}
          restore-keys: |
            upstream-m2-${{ runner.os }}-${{ runner.arch }}-jdk17-${{ matrix.version }}-
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native -> ../.flink-suite/${{ matrix.line }}/streamfusion-source/native/target
      - name: Build Flink and StreamFusion once
        env:
          FLINK_VERSION: ${{ matrix.version }}
        run: |
          set -o pipefail
          bin/flink-suite.sh prepare 2>&1 | tee upstream-prepare.log
          python3 dev/flink-suite/shared_build.py pack \
            --root ".flink-suite/${{ matrix.line }}" --version "${{ matrix.version }}" \
            --archive upstream-build.tar.zst
      - uses: actions/upload-artifact@v4
        with:
          name: upstream-build-${{ matrix.line }}-${{ github.sha }}
          path: upstream-build.tar.zst
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-prepare-${{ matrix.line }}-${{ github.sha }}
          path: |
            upstream-prepare.log
            .flink-suite/${{ matrix.line }}/runtime-shards.json
          include-hidden-files: true
          retention-days: 7

  upstream-suite:
    name: ${{ matrix.label }} suite (Flink ${{ matrix.line }})
    needs: [suite-matrix, prepare]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.suite-matrix.outputs.suites) }}
    steps:
      - uses: actions/checkout@v6
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/download-artifact@v5
        with:
          name: upstream-build-${{ matrix.line }}-${{ github.sha }}
      - name: Restore the shared build
        run: |
          python3 dev/flink-suite/shared_build.py restore \
            --root ".flink-suite/${{ matrix.line }}" --version "${{ matrix.version }}" \
            --archive upstream-build.tar.zst
          rm upstream-build.tar.zst
      - name: Run unchanged upstream suite with StreamFusion
        env:
          FLINK_VERSION: ${{ matrix.version }}
          FLINK_SUITE_REUSE_COMMON_BUILD: 'true'
          FLINK_SUITE_SHARD: ${{ matrix.shard }}
          FLINK_SUITE_SQL_INVENTORY: ${{ inputs.sql_inventory || false }}
        run: |
          set -o pipefail
          bin/flink-suite.sh "${{ matrix.suite }}" 2>&1 | tee upstream-suite.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-flink-${{ matrix.line }}-${{ matrix.label }}-${{ github.sha }}
          path: |
            upstream-suite.log
            .flink-suite/**/native-execution/
            .flink-suite/**/diagnostics/
            .flink-suite/**/sql-inventory/
            .flink-suite/**/target/surefire-reports/
          include-hidden-files: true
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: matrix.suite == 'runtime'
        with:
          name: runtime-coverage-${{ matrix.line }}-${{ matrix.shard }}
          path: |
            .flink-suite/${{ matrix.line }}/runtime-shards.json
            .flink-suite/${{ matrix.line }}/diagnostics/runtime/shard-coverage.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  runtime-coverage:
    name: Complete runtime coverage (Flink ${{ matrix.line }})
    if: ${{ !inputs.sql_inventory || inputs.inventory_scope != 'connectors' }}
    needs: upstream-suite
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        line: ['2.2', '1.18']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v5
        with:
          pattern: runtime-coverage-${{ matrix.line }}-*
          path: runtime-coverage
      - name: Require every runtime shard and parameterized invocation
        run: |
          python3 dev/flink-suite/runtime_shards.py aggregate \
            --plan "runtime-coverage/runtime-coverage-${{ matrix.line }}-1/runtime-shards.json" \
            --reports runtime-coverage

  legacy-delta-audit:
    if: ${{ !inputs.sql_inventory }}
    name: Delta 3.3 / Flink 1.18 host audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run unchanged legacy Delta SQL tests against released Flink 1.18
        run: |
          set -o pipefail
          bin/delta-legacy-audit.sh 2>&1 | tee delta-legacy-audit.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: delta-legacy-flink118-${{ github.sha }}
          path: |
            delta-legacy-audit.log
            .flink-suite/delta-legacy-1.18/target/surefire-reports/
          include-hidden-files: true
          retention-days: 7

  all-tests:
    name: All upstream integration tests
    if: ${{ always() && !inputs.sql_inventory }}
    needs: [suite-matrix, prepare, upstream-suite, runtime-coverage, legacy-delta-audit]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every upstream suite to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: jq -e 'length > 0 and all(.[]; .result == "success")' <<< "$NEEDS_JSON"
