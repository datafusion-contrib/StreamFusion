name: Upstream Flink suite

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch:
    inputs:
      sql_inventory:
        description: 'Run both planner SQL corpora with complete invocation inventories'
        type: boolean
        default: false
  schedule:
    - cron: "17 7 * * 1"

permissions:
  contents: read

concurrency:
  group: upstream-flink-suite-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  upstream-suite:
    name: ${{ matrix.suite }} suite${{ matrix.suffix }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ inputs.sql_inventory && fromJSON('["runtime"]') || fromJSON('["runtime", "formats", "parquet", "orc", "kafka", "paimon", "delta", "state"]') }}
        line: ['2.2', '1.18']
        exclude:
          - suite: delta
            line: '1.18'
        include:
          - line: '2.2'
            version: '2.2.1'
            suffix: ''
          - line: '1.18'
            version: '1.18.1'
            suffix: ' (Flink 1.18)'
    steps:
      - uses: actions/checkout@v6

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          df -h /

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - uses: dtolnay/rust-toolchain@1.94.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native -> ../.flink-suite/${{ matrix.line }}/streamfusion-source/native/target

      - name: Run unchanged upstream suite with StreamFusion
        env:
          FLINK_VERSION: ${{ matrix.version }}
          FLINK_SUITE_SQL_INVENTORY: ${{ inputs.sql_inventory || false }}
        run: |
          set -o pipefail
          bin/flink-suite.sh "${{ matrix.suite }}" 2>&1 | tee upstream-suite.log

      - name: Require a complete SQL inventory
        if: ${{ always() && inputs.sql_inventory }}
        run: |
          python3 dev/flink-suite/sql_inventory.py \
            --reports .flink-suite/${{ matrix.line }}/flink-${{ matrix.version }}/flink-table/flink-table-planner/target/surefire-reports \
            --evidence .flink-suite/${{ matrix.line }}/diagnostics/runtime/sql-inventory \
            --line '${{ matrix.line }}' --revision '${{ github.sha }}' \
            --output .flink-suite/${{ matrix.line }}/sql-inventory

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-flink-${{ matrix.line }}-${{ matrix.suite }}-${{ github.sha }}
          path: |
            upstream-suite.log
            .flink-suite/**/native-execution/
            .flink-suite/**/diagnostics/
            .flink-suite/**/sql-inventory/
            .flink-suite/**/target/surefire-reports/
          include-hidden-files: true
          retention-days: 7

  legacy-delta-audit:
    if: ${{ !inputs.sql_inventory }}
    name: Delta 3.3 / Flink 1.18 host audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run unchanged legacy Delta SQL tests against released Flink 1.18
        run: |
          set -o pipefail
          bin/delta-legacy-audit.sh 2>&1 | tee delta-legacy-audit.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: delta-legacy-flink118-${{ github.sha }}
          path: |
            delta-legacy-audit.log
            .flink-suite/delta-legacy-1.18/target/surefire-reports/
          include-hidden-files: true
          retention-days: 7

  all-tests:
    name: All upstream integration tests
    if: ${{ always() && !inputs.sql_inventory }}
    needs: [upstream-suite, legacy-delta-audit]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every upstream suite to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: jq -e 'length > 0 and all(.[]; .result == "success")' <<< "$NEEDS_JSON"
