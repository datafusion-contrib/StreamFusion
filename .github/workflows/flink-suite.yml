name: Upstream Flink suite
run-name: >-
  ${{ inputs.sql_inventory && format('SQL admission inventory ({0})', inputs.inventory_scope)
      || 'Full upstream Flink suite (merge gate)' }}

on:
  push:
    branches: ['main', 'ci/**']
  workflow_dispatch:
    inputs:
      sql_inventory:
        description: 'Record complete per-invocation SQL admission inventories'
        type: boolean
        default: false
      inventory_scope:
        description: 'Suites selected when sql_inventory is enabled'
        type: choice
        options: [runtime, connectors, all]
        default: runtime
  schedule:
    - cron: "17 7 * * 1"

permissions:
  contents: read
  actions: read

concurrency:
  group: upstream-flink-suite-${{ github.ref }}-${{ inputs.sql_inventory && inputs.inventory_scope || 'tests' }}
  cancel-in-progress: true

jobs:
  plan:
    name: Coverage plan
    if: ${{ (github.event_name != 'schedule' || github.repository == 'datafusion-contrib/StreamFusion') && (github.repository != 'datafusion-contrib/StreamFusion' || github.ref == 'refs/heads/main') }}
    uses: ./.github/workflows/ci-plan.yml

  upstream-flink-22:
    name: Flink 2.2
    needs: plan
    if: needs.plan.outputs.tests == 'true'
    uses: ./.github/workflows/flink-suite-line.yml
    with:
      line: '2.2'
      version: '2.2.1'
      sql_inventory: ${{ inputs.sql_inventory || false }}
      inventory_scope: ${{ inputs.inventory_scope || 'all' }}

  upstream-flink-118:
    name: Flink 1.18
    needs: plan
    if: needs.plan.outputs.tests == 'true'
    uses: ./.github/workflows/flink-suite-line.yml
    with:
      line: '1.18'
      version: '1.18.1'
      sql_inventory: ${{ inputs.sql_inventory || false }}
      inventory_scope: ${{ inputs.inventory_scope || 'all' }}

  legacy-delta-audit:
    needs: plan
    if: ${{ !inputs.sql_inventory && needs.plan.outputs.tests == 'true' }}
    name: Delta 3.3 / Flink 1.18 host audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: dev/flink-suite/delta-legacy/pom.xml
      - name: Run unchanged legacy Delta SQL tests against released Flink 1.18
        run: |
          set -o pipefail
          bin/delta-legacy-audit.sh 2>&1 | tee delta-legacy-audit.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: delta-legacy-flink118-${{ github.sha }}
          path: |
            delta-legacy-audit.log
            .flink-suite/delta-legacy-1.18/target/surefire-reports/
          include-hidden-files: true
          retention-days: 7

  all-tests:
    name: All upstream integration tests
    if: ${{ (always() && !cancelled()) && (github.event_name != 'schedule' || github.repository == 'datafusion-contrib/StreamFusion') && (github.repository != 'datafusion-contrib/StreamFusion' || github.ref == 'refs/heads/main') }}
    needs: [plan, upstream-flink-22, upstream-flink-118, legacy-delta-audit]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require every upstream suite to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          INVENTORY: ${{ inputs.sql_inventory || false }}
          REUSED_COVERAGE: ${{ needs.plan.outputs.tests == 'false' }}
        run: |
          jq -e --arg inventory "$INVENTORY" --arg reused "$REUSED_COVERAGE" '
            .plan.result == "success" and
            if $reused == "true" then
              all(to_entries[]; .key == "plan" or .value.result == "skipped")
            else
              all(to_entries[];
                .value.result == "success" or
                ($inventory == "true" and .key == "legacy-delta-audit" and .value.result == "skipped"))
            end
          ' <<< "$NEEDS_JSON"
      - uses: actions/checkout@v6
        if: ${{ needs.plan.outputs.tests == 'true' && (!inputs.sql_inventory || inputs.inventory_scope != 'connectors') }}
      - uses: actions/download-artifact@v5
        if: ${{ needs.plan.outputs.tests == 'true' && (!inputs.sql_inventory || inputs.inventory_scope != 'connectors') }}
        with:
          pattern: runtime-coverage-2.2-*
          path: runtime-coverage/2.2
      - uses: actions/download-artifact@v5
        if: ${{ needs.plan.outputs.tests == 'true' && (!inputs.sql_inventory || inputs.inventory_scope != 'connectors') }}
        with:
          pattern: runtime-coverage-1.18-*
          path: runtime-coverage/1.18
      - name: Require every runtime shard and parameterized invocation on both lines
        if: ${{ needs.plan.outputs.tests == 'true' && (!inputs.sql_inventory || inputs.inventory_scope != 'connectors') }}
        run: |
          for line in 2.2 1.18; do
            python3 dev/flink-suite/runtime_shards.py aggregate \
              --plan "runtime-coverage/$line/runtime-coverage-$line-1/runtime-shards.json" \
              --reports "runtime-coverage/$line"
          done
