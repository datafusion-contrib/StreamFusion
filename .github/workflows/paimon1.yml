name: Paimon 1.0.0 compatibility

on:
  workflow_dispatch:
  push:
    branches: ['main']
    paths:
      - 'streamfusion-paimon1/**'
      - 'streamfusion-paimon/**'
      - 'streamfusion-paimon/src/main/java/tech/streamfusion/paimon/**'
      - 'streamfusion-paimon/src/main/java/tech/streamfusion/planner/**/*Paimon*'
      - 'streamfusion-core/src/main/java/tech/streamfusion/arrow/**'
      - 'streamfusion-parquet/src/main/java/tech/streamfusion/parquet/**'
      - 'streamfusion-orc/src/main/java/tech/streamfusion/orc/**'
      - 'streamfusion-core/src/main/java/tech/streamfusion/operator/**'
      - 'native/paimon/**'
      - 'native/parquet/**'
      - 'native/orc/**'
      - 'dev/flink-suite/agent/**'
      - 'dev/flink-suite/paimon-log4j2.properties'
      - 'native/engine/src/keyed_upsert/**'
      - 'native/bridge/**'
      - 'bin/ci-free-disk.py'
      - 'bin/paimon1-suite.sh'
      - 'bin/paimon-compaction-suite.py'
      - 'dev/tools/suites/paimon_compaction.py'
      - 'dev/tools/ci/free_disk.py'
      - 'dev/tools/checks/native_workspace.py'
      - 'dev/flink-suite/paimon-compaction*'
      - 'dev/tools/tests/test_paimon1_ci.py'
      - 'pom.xml'
      - '.github/workflows/paimon1.yml'

concurrency:
  group: paimon1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    name: Paimon 1.0.0 / Flink 1.18
    if: ${{ github.repository != 'datafusion-contrib/StreamFusion' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v6
      - name: Free disk space
        run: python3 bin/ci-free-disk.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          key: paimon1-release
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build release native libraries once for the complete reactor
        working-directory: native
        run: cargo build --workspace --lib --release --features mimalloc --locked --timings
      - name: Verify native JNI exports
        run: python3 bin/check-native-workspace.py --libraries native/target/release
      - name: Source and sink parity (reuse release libraries)
        run: >-
          mvn -B -ntp -Pflink-1.18,paimon1,bench -pl streamfusion-paimon1 -am
          -Dnative.build.skip=true
          -Dsf.testForks=1 '-Dtest=LegacyPaimon*Test,PaimonAppendRouting*Test,PaimonSourceSqlTest,PaimonSplitWatermarksTest,PaimonFetcherLifecycleTest,PaimonCompaction*Test,PaimonMaintenanceTest,PaimonBatchSqlTest,PaimonBatchEncodingTest'
          -Dsurefire.failIfNoSpecifiedTests=false '-Dsf.extraJvmArgs=-Xmx2g -XX:ActiveProcessorCount=2 --add-opens=java.base/java.math=ALL-UNNAMED --add-opens=java.base/java.time=ALL-UNNAMED --add-opens=java.base/java.lang.invoke=ALL-UNNAMED' test
      - name: Verify upstream fork isolation offline
        env:
          MAVEN_ARGS: '-o'
        run: python3 -m unittest discover -s dev/tools/tests -p test_paimon1_ci.py
      - name: Plan every released TPC-DS variant with the legacy adapter
        env:
          SF_TPCDS: 'true'
        run: |
          tpcds_scratch="$RUNNER_TEMP/paimon1-tpcds"
          trap 'rm -rf "$tpcds_scratch"' EXIT
          mvn -B -ntp -Pflink-1.18,paimon1,bench,tpcds -pl streamfusion-paimon1 -am \
            -Dnative.build.skip=true -Dsf.runtime.tests.skip=true \
            -Dtest=PaimonTpcdsBenchmark -Dsurefire.failIfNoSpecifiedTests=false \
            -Dsf.tpcds.mode=plan -Dsf.tpcds.scale=0.01 \
            -Dsf.tpcds.directory="$tpcds_scratch" test
      - name: Released upstream merge-engine compaction fixtures
        run: python3 bin/paimon-compaction-suite.py --paimon-version 1.0.0 --release --skip-native-build
      - name: Upstream SQL tests (reuse release libraries)
        env:
          SF_PAIMON1_TEST_FORKS: '1'
          SF_PAIMON1_QUARANTINE_REBALANCE_PREFIX: 'true'
        run: >-
          bin/paimon1-suite.sh -Pbench -Dnative.build.skip=true
          -Dstreamfusion.flink-suite.retain-failed-warehouse=true
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paimon1-flink118-results
          path: |
            streamfusion-paimon1/target/surefire-reports/
            streamfusion-paimon1/target/upstream-suite/run.log
            streamfusion-paimon1/target/upstream-suite/inventory/
            streamfusion-paimon1/target/upstream-suite/diagnostics/
            streamfusion-paimon1/target/native-reports/
            streamfusion-paimon1/target/upstream-compaction/*/stock/
            streamfusion-paimon1/target/upstream-compaction/*/native/
            native/target/cargo-timings/
