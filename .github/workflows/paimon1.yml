name: Paimon 1.0.0 compatibility

on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths:
      - 'streamfusion-paimon1/**'
      - 'streamfusion-paimon/**'
      - 'src/main/java/tech/streamfusion/paimon/**'
      - 'src/main/java/tech/streamfusion/planner/*Paimon*'
      - 'src/main/java/tech/streamfusion/arrow/**'
      - 'src/main/java/tech/streamfusion/parquet/**'
      - 'src/main/java/tech/streamfusion/orc/**'
      - 'src/main/java/tech/streamfusion/operator/**'
      - 'native/paimon/**'
      - 'native/parquet/**'
      - 'native/orc/**'
      - 'dev/flink-suite/agent/**'
      - 'dev/flink-suite/paimon-log4j2.properties'
      - 'native/engine/src/keyed_upsert/**'
      - 'native/bridge/**'
      - 'bin/ci-free-disk.py'
      - 'bin/paimon1-suite.sh'
      - 'bin/paimon-compaction-suite.py'
      - 'dev/flink-suite/paimon-compaction*'
      - 'bin/test_paimon1_ci.py'
      - 'pom.xml'
      - '.github/workflows/paimon1.yml'

concurrency:
  group: paimon1-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  parity:
    if: ${{ github.repository != 'datafusion-contrib/StreamFusion' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v6
      - name: Free disk space
        run: python3 bin/ci-free-disk.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          key: paimon1-release
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Test upstream fork isolation
        run: python3 -m unittest discover -s bin -p test_paimon1_ci.py
      - name: Build release native libraries once for the complete reactor
        working-directory: native
        run: cargo build --workspace --lib --release --features mimalloc --locked --timings
      - name: Verify native JNI exports
        run: python3 bin/check-native-workspace.py --libraries native/target/release
      - name: Source and sink parity (reuse release libraries)
        run: >-
          mvn -B -ntp -Pflink-1.18,paimon1,bench -pl streamfusion-paimon1 -am
          -Dnative.build.skip=true
          -Dsf.testForks=1 '-Dtest=LegacyPaimon*Test,PaimonSourceSqlTest,PaimonSplitWatermarksTest,PaimonFetcherLifecycleTest,PaimonCompaction*Test,PaimonMaintenanceTest'
          -Dsurefire.failIfNoSpecifiedTests=false '-Dsf.extraJvmArgs=-Xmx2g -XX:ActiveProcessorCount=2 --add-opens=java.base/java.math=ALL-UNNAMED --add-opens=java.base/java.time=ALL-UNNAMED --add-opens=java.base/java.lang.invoke=ALL-UNNAMED' test
      - name: Released upstream merge-engine compaction fixtures
        run: python3 bin/paimon-compaction-suite.py --paimon-version 1.0.0 --release --skip-native-build
      - name: Upstream SQL tests (reuse release libraries)
        env:
          SF_PAIMON1_TEST_FORKS: '1'
        run: >-
          bin/paimon1-suite.sh -Pbench -Dnative.build.skip=true
          -Dstreamfusion.flink-suite.retain-failed-warehouse=true
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paimon1-flink118-results
          path: |
            streamfusion-paimon1/target/surefire-reports/
            streamfusion-paimon1/target/upstream-suite/run.log
            streamfusion-paimon1/target/upstream-suite/inventory/
            streamfusion-paimon1/target/upstream-suite/diagnostics/
            streamfusion-paimon1/target/native-reports/
            streamfusion-paimon1/target/upstream-compaction/
            native/target/cargo-timings/
