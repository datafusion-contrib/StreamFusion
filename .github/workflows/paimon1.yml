name: Paimon 1.0.0 compatibility

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'streamfusion-paimon1/**'
      - 'streamfusion-paimon/**'
      - 'src/main/java/tech/streamfusion/paimon/**'
      - 'src/main/java/tech/streamfusion/planner/*Paimon*'
      - 'src/main/java/tech/streamfusion/arrow/**'
      - 'src/main/java/tech/streamfusion/parquet/**'
      - 'src/main/java/tech/streamfusion/orc/**'
      - 'src/main/java/tech/streamfusion/operator/**'
      - 'native/paimon/**'
      - 'native/parquet/**'
      - 'native/orc/**'
      - 'dev/flink-suite/agent/**'
      - 'dev/flink-suite/paimon-log4j2.properties'
      - 'native/engine/src/keyed_upsert/**'
      - 'native/bridge/**'
      - 'bin/paimon1-suite.sh'
      - 'pom.xml'
      - '.github/workflows/paimon1.yml'
  push:
    branches: [main]
    paths:
      - 'streamfusion-paimon1/**'
      - 'streamfusion-paimon/**'
      - 'src/main/java/tech/streamfusion/paimon/**'
      - 'src/main/java/tech/streamfusion/planner/*Paimon*'
      - 'src/main/java/tech/streamfusion/arrow/**'
      - 'src/main/java/tech/streamfusion/parquet/**'
      - 'src/main/java/tech/streamfusion/orc/**'
      - 'src/main/java/tech/streamfusion/operator/**'
      - 'native/paimon/**'
      - 'native/parquet/**'
      - 'native/orc/**'
      - 'dev/flink-suite/agent/**'
      - 'dev/flink-suite/paimon-log4j2.properties'
      - 'native/engine/src/keyed_upsert/**'
      - 'native/bridge/**'
      - 'bin/paimon1-suite.sh'
      - 'pom.xml'
      - '.github/workflows/paimon1.yml'

concurrency:
  group: paimon1-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v6
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - name: Source and sink parity
        run: >-
          mvn -B -ntp -Pflink-1.18,paimon1 -pl streamfusion-paimon1 -am
          -Dsf.testForks=1 '-Dtest=LegacyPaimon*Test,PaimonSourceSqlTest,PaimonSplitWatermarksTest'
          -Dsurefire.failIfNoSpecifiedTests=false '-Dsf.extraJvmArgs=-Xmx2g -XX:ActiveProcessorCount=2 --add-opens=java.base/java.math=ALL-UNNAMED --add-opens=java.base/java.time=ALL-UNNAMED --add-opens=java.base/java.lang.invoke=ALL-UNNAMED' test
      - name: Upstream SQL tests
        run: bin/paimon1-suite.sh -Pbench
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paimon1-flink118-results
          path: |
            streamfusion-paimon1/target/surefire-reports/
            streamfusion-paimon1/target/upstream-suite/run.log
            streamfusion-paimon1/target/upstream-suite/inventory/
            streamfusion-paimon1/target/upstream-suite/diagnostics/
