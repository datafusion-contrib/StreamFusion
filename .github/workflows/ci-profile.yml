name: CI startup profile

on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Paired JVM comparison to run'
        type: choice
        options: [runtime, runtime-parallel, runtime-jfr, canonical, native-only, runtime-hotspots]
        default: runtime
      native_run:
        description: 'Existing native-producing run for runtime-hotspots'
        type: string
      flink_line:
        description: 'Flink line for the canonical-gc-matrix diagnostic'
        type: choice
        options: [all, '2.2', '1.18']
        default: all
      hotspot_mode:
        description: 'Attribute slow classes or compare their worker counts'
        type: choice
        options: [attribution, parallel, plan-cache, canonical-parallel, canonical-gc, canonical-gc-matrix, deeper-runtime, fluss-details, recursive-completion, recovery-diagnostics, recovery-transport, fluss-close, runtime-regressions]
        default: attribution

permissions:
  contents: read
  actions: read

env:
  RUST_BACKTRACE: '1'

concurrency:
  group: ci-startup-profile-${{ github.ref }}-${{ inputs.suite }}-${{ inputs.hotspot_mode }}-${{ inputs.flink_line || 'all' }}
  cancel-in-progress: true

jobs:
  native:
    if: ${{ inputs.suite != 'runtime-hotspots' && (github.repository != 'datafusion-contrib/StreamFusion' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v6
      - run: python3 bin/ci-free-disk.py
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          shared-key: debug-jvm
          save-if: ${{ github.repository != 'datafusion-contrib/StreamFusion' || github.ref == 'refs/heads/main' }}
      - run: cargo build --manifest-path native/Cargo.toml --workspace --lib --locked --timings
      - uses: actions/upload-artifact@v4
        if: inputs.suite != 'native-only'
        with:
          name: ci-profile-native-${{ github.sha }}
          path: native/target/debug/libstreamfusion.so
          compression-level: 1
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-profile-native-timings-${{ github.sha }}
          path: native/target/cargo-timings
          retention-days: 1
          if-no-files-found: ignore

  paired:
    needs: native
    if: inputs.suite == 'canonical'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        jdk: ['11', '17']
    steps:
      - uses: actions/checkout@v6
      - run: python3 bin/ci-free-disk.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
          cache: maven
      - uses: actions/download-artifact@v5
        with:
          name: ci-profile-native-${{ github.sha }}
          path: native/target/debug
      - name: Compile the unchanged profile cases once
        run: |
          python3 bin/ci-maven-dependencies.py --projects streamfusion-runtime
          python3 bin/ci-maven-dependencies.py --artifact org.apache.maven.surefire:surefire-junit-platform:3.2.5
          mvn -B -ntp -pl streamfusion-runtime -am test-compile -Dnative.build.skip=true
      - name: Alternate default and startup JVM settings on the same runner
        run: python3 bin/profile-canonical-ci.py --output "$RUNNER_TEMP/ci-startup-profile" --repetitions 3 --cds
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-startup-profile-jdk${{ matrix.jdk }}
          path: |
            ${{ runner.temp }}/ci-startup-profile/
            streamfusion-runtime/target/surefire-reports/*ci-profile*
          retention-days: 7

  runtime:
    needs: native
    if: inputs.suite != 'canonical' && inputs.suite != 'native-only' && inputs.suite != 'runtime-hotspots'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.suite == 'runtime-jfr' && '[{"jdk":"17","line":"2.2","jfr":true}]' || inputs.suite == 'runtime-parallel' && '[{"jdk":"11","line":"1.18"},{"jdk":"17","line":"1.18"},{"jdk":"11","line":"2.2"},{"jdk":"17","line":"2.2"},{"jdk":"17","line":"2.2","jfr":true}]' || '[{"jdk":"11","line":"1.18"},{"jdk":"17","line":"1.18"},{"jdk":"11","line":"2.2"},{"jdk":"17","line":"2.2"}]') }}
    steps:
      - uses: actions/checkout@v6
      - run: python3 bin/ci-free-disk.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
          cache: maven
      - uses: actions/download-artifact@v5
        with:
          name: ci-profile-native-${{ github.sha }}
          path: native/target/debug
      - name: Compile the unchanged runtime cases once
        env:
          FLINK_LINE: ${{ matrix.line }}
        run: |
          profile=()
          profile_name=''
          if [[ "$FLINK_LINE" == '1.18' ]]; then
            profile=(-Pflink-1.18)
            profile_name='flink-1.18'
          fi
          python3 bin/ci-maven-dependencies.py --profile "$profile_name" --projects streamfusion-runtime
          python3 bin/ci-maven-dependencies.py --artifact org.apache.maven.surefire:surefire-junit-platform:3.2.5
          mvn -B -ntp "${profile[@]}" -pl streamfusion-runtime -am test-compile -Dnative.build.skip=true
      - name: Compare runtime JVM compilation with identical assertions
        env:
          PROFILE_SUITE: ${{ inputs.suite }}
          RECORD_JFR: ${{ matrix.jfr }}
          FLINK_LINE: ${{ matrix.line }}
        run: |
          args=(--line "$FLINK_LINE" --repetitions 3)
          if [[ "$RECORD_JFR" == 'true' ]]; then
            args=(--line "$FLINK_LINE" --repetitions 1 --jfr)
          elif [[ "$PROFILE_SUITE" == 'runtime-parallel' ]]; then
            args+=(--parallel)
          fi
          python3 bin/profile-runtime-ci.py --output "$RUNNER_TEMP/runtime-startup-profile" "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-startup-profile-flink${{ matrix.line }}-jdk${{ matrix.jdk }}${{ matrix.jfr && '-jfr' || '' }}
          path: |
            ${{ runner.temp }}/runtime-startup-profile/
            streamfusion-runtime/target/surefire-reports/*runtime-profile*
          retention-days: 7

  hotspots:
    if: inputs.suite == 'runtime-hotspots' && (github.repository != 'datafusion-contrib/StreamFusion' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    concurrency:
      group: ci-hotspot-profile-${{ github.ref }}-${{ inputs.hotspot_mode }}-${{ matrix.line }}-jdk${{ matrix.jdk }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        jdk: ${{ fromJSON((inputs.hotspot_mode == 'parallel' || inputs.hotspot_mode == 'canonical-gc-matrix') && '["11"]' || (inputs.hotspot_mode == 'deeper-runtime' || inputs.hotspot_mode == 'fluss-details' || inputs.hotspot_mode == 'fluss-close' || inputs.hotspot_mode == 'recursive-completion' || inputs.hotspot_mode == 'runtime-regressions' || inputs.hotspot_mode == 'recovery-diagnostics' || inputs.hotspot_mode == 'recovery-transport') && '["17"]' || '["11", "17"]') }}
        line: ${{ fromJSON(inputs.hotspot_mode == 'canonical-gc-matrix' && (inputs.flink_line == '1.18' && '["1.18"]' || inputs.flink_line == '2.2' && '["2.2"]' || '["2.2", "1.18"]') || '["2.2"]') }}
    steps:
      - uses: actions/checkout@v6
        with:
          filter: blob:none
      - run: python3 bin/ci-free-disk.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
          cache: maven
      - name: Verify native artifact source and completed producer
        id: native
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_RUN: ${{ inputs.native_run }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', path]))
          run_id = os.environ['NATIVE_RUN']
          if not re.fullmatch(r'[0-9]+', run_id):
              raise SystemExit('Expected a numeric native workflow run ID')
          repo = os.environ['GITHUB_REPOSITORY']
          run = api(f'repos/{repo}/actions/runs/{run_id}')
          sha = run['head_sha']
          jobs = api(f'repos/{repo}/actions/runs/{run_id}/jobs?per_page=100')['jobs']
          if not any(j['name'] == 'Shared debug native libraries' and j['conclusion'] == 'success' for j in jobs):
              raise SystemExit('Native producer has not succeeded')
          subprocess.run(['git', 'fetch', '--no-tags', '--filter=blob:none', '--depth=1', 'origin', sha], check=True)
          subprocess.run(['git', 'diff', '--exit-code', sha, 'HEAD', '--',
                          'native', 'rust-toolchain.toml', '.cargo', '.github/actions/setup-rust'], check=True)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'artifact=debug-native-{sha}\n')
          print(f'Reusing native libraries from successful producer at {sha}')
          PY
      - uses: actions/download-artifact@v5
        with:
          name: ${{ steps.native.outputs.artifact }}
          run-id: ${{ inputs.native_run }}
          github-token: ${{ github.token }}
          path: native/target/debug
      - name: Compile the unchanged complete runtime inventory
        env:
          HOTSPOT_MODE: ${{ inputs.hotspot_mode }}
          FLINK_LINE: ${{ matrix.line }}
        run: |
          profile=()
          profile_name=''
          projects='streamfusion-runtime'
          goal='test-compile'
          skip=()
          if [[ "$HOTSPOT_MODE" == 'canonical-parallel' || "$HOTSPOT_MODE" == 'canonical-gc-matrix' ]]; then
            profile=(-Pcanonical-kafka)
            profile_name='canonical-kafka'
            if [[ "$FLINK_LINE" == '1.18' ]]; then
              profile=(-Pflink-1.18,canonical-kafka)
              profile_name='flink-1.18,canonical-kafka'
            fi
          elif [[ "$HOTSPOT_MODE" == 'deeper-runtime' || "$HOTSPOT_MODE" == 'fluss-details' || "$HOTSPOT_MODE" == 'fluss-close' ]]; then
            projects='streamfusion-fluss'
            goal='test'
            skip=(-DskipTests)
          elif [[ "$HOTSPOT_MODE" == 'recovery-diagnostics' ]]; then
            profile=(-Pflink-1.18,ci-diagnostics)
            profile_name='flink-1.18,ci-diagnostics'
            goal='test'
            skip=(-DskipTests)
          elif [[ "$HOTSPOT_MODE" == 'recovery-transport' ]]; then
            profile=(-Pflink-1.18)
            profile_name='flink-1.18'
          fi
          python3 bin/ci-maven-dependencies.py --profile "$profile_name" --projects "$projects" --also-make
          python3 bin/ci-maven-dependencies.py --artifact org.apache.maven.surefire:surefire-junit-platform:3.2.5
          mvn -B -ntp "${profile[@]}" -pl "$projects" -am "$goal" "${skip[@]}" -Dnative.build.skip=true
      - name: Attribute measured slow classes under current CI worker settings
        env:
          HOTSPOT_MODE: ${{ inputs.hotspot_mode }}
          FLINK_LINE: ${{ matrix.line }}
        run: |
          args=(--line 2.2 --repetitions 1 --hotspots)
          if [[ "$HOTSPOT_MODE" == 'parallel' ]]; then
            args=(--line 2.2 --repetitions 2 --slow-mix --parallel)
          elif [[ "$HOTSPOT_MODE" == 'plan-cache' ]]; then
            args=(--line 2.2 --repetitions 2 --plan-cache)
          fi
          nproc
          free -m
          vmstat -w 15 > "$RUNNER_TEMP/runtime-hotspots-vmstat.txt" &
          memory_sampler=$!
          trap 'kill "$memory_sampler" 2>/dev/null || true' EXIT
          if [[ "$HOTSPOT_MODE" == 'deeper-runtime' || "$HOTSPOT_MODE" == 'fluss-details' || "$HOTSPOT_MODE" == 'fluss-close' ]]; then
            (
              while true; do
                date -u
                docker stats --no-stream --format '{{json .}}'
                sleep 15
              done
            ) > "$RUNNER_TEMP/runtime-hotspots-containers.txt" &
            container_sampler=$!
            trap 'kill "$memory_sampler" "$container_sampler" 2>/dev/null || true' EXIT
            if [[ "$HOTSPOT_MODE" == 'deeper-runtime' ]]; then
              python3 bin/profile-ci-details.py --line 2.2 --suite recursive --output "$RUNNER_TEMP/runtime-hotspots/recursive"
            fi
            comparison=()
            if [[ "$HOTSPOT_MODE" == 'fluss-close' ]]; then
              started=$SECONDS
              docker pull zookeeper:3.9.2
              docker pull apache/fluss:1.0.0
              mkdir -p "$RUNNER_TEMP/runtime-hotspots"
              echo "Docker image preparation: $((SECONDS - started)) seconds" > "$RUNNER_TEMP/runtime-hotspots/image-preparation.txt"
              comparison=(--compare-close)
            fi
            python3 bin/profile-ci-details.py --line 2.2 --suite fluss "${comparison[@]}" --output "$RUNNER_TEMP/runtime-hotspots/fluss"
          elif [[ "$HOTSPOT_MODE" == 'runtime-regressions' ]]; then
            python3 bin/profile-ci-details.py --line 2.2 --suite regressions --output "$RUNNER_TEMP/runtime-hotspots/regressions"
          elif [[ "$HOTSPOT_MODE" == 'recursive-completion' ]]; then
            python3 bin/profile-ci-details.py --line 2.2 --suite recursive --compare-completion --output "$RUNNER_TEMP/runtime-hotspots/recursive-completion"
          elif [[ "$HOTSPOT_MODE" == 'recovery-diagnostics' ]]; then
            python3 bin/profile-ci-details.py --line 1.18 --suite recovery --output "$RUNNER_TEMP/runtime-hotspots/recovery"
          elif [[ "$HOTSPOT_MODE" == 'recovery-transport' ]]; then
            python3 bin/profile-ci-details.py --line 1.18 --suite recovery --compare-transport --output "$RUNNER_TEMP/runtime-hotspots/recovery-transport"
          elif [[ "$HOTSPOT_MODE" == 'canonical-parallel' ]]; then
            python3 bin/profile-canonical-ci.py --parallel --repetitions 2 --output "$RUNNER_TEMP/runtime-hotspots"
          elif [[ "$HOTSPOT_MODE" == 'canonical-gc' ]]; then
            python3 bin/profile-canonical-ci.py --gc --repetitions 3 --output "$RUNNER_TEMP/runtime-hotspots"
          elif [[ "$HOTSPOT_MODE" == 'canonical-gc-matrix' ]]; then
            python3 bin/profile-canonical-ci.py --gc --worker-mix --line "$FLINK_LINE" --repetitions 2 --output "$RUNNER_TEMP/runtime-hotspots"
          else
            python3 bin/profile-runtime-ci.py "${args[@]}" --output "$RUNNER_TEMP/runtime-hotspots"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-hotspots-${{ inputs.hotspot_mode }}-${{ inputs.hotspot_mode == 'canonical-gc-matrix' && format('flink{0}-', matrix.line) || '' }}jdk${{ matrix.jdk }}
          path: |
            ${{ runner.temp }}/runtime-hotspots/
            ${{ runner.temp }}/runtime-hotspots-vmstat.txt
            ${{ runner.temp }}/runtime-hotspots-containers.txt
            streamfusion-runtime/target/surefire-reports/*runtime-profile*
          retention-days: 7
