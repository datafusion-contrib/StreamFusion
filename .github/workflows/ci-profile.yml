name: CI startup profile

on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Paired JVM comparison to run'
        type: choice
        options: [runtime, runtime-parallel, runtime-jfr, canonical, native-only, runtime-hotspots, canonical-setup, canonical-reference, lake-setup, native-lz4, failure-regressions]
        default: runtime
      native_run:
        description: 'Existing native producer for focused diagnostics'
        type: string
      jdk:
        description: 'JDK for a focused setup diagnostic'
        type: choice
        options: ['11', '17']
        default: '11'
      parent_jfr:
        description: 'Record the canonical setup probe parent JVMs for attribution'
        type: boolean
        default: false
      metadata_regression:
        description: 'Check metadata collector isolation and complete append arithmetic'
        type: boolean
        default: false
      kafka_rescale_regression:
        description: 'Check Kafka codec, rescale, task-failure and completed-handoff recovery'
        type: boolean
        default: false
      flink_line:
        description: 'Flink line for multi-release diagnostics'
        type: choice
        options: [all, '2.2', '1.18']
        default: all
      hotspot_mode:
        description: 'Attribute slow classes or compare their worker counts'
        type: choice
        options: [attribution, parallel, plan-cache, canonical-parallel, canonical-gc, canonical-gc-matrix, cluster-startup, deeper-runtime, fluss-details, recursive-completion, recovery-diagnostics, recovery-transport, fluss-close, runtime-regressions]
        default: attribution

permissions:
  contents: read
  actions: read

env:
  RUST_BACKTRACE: '1'
  CANONICAL_JAVA_11: '11.0.32+9'
  CANONICAL_JAVA_17: '17.0.21+9'

concurrency:
  group: ci-startup-profile-${{ github.ref }}-${{ inputs.suite }}-${{ inputs.hotspot_mode }}-${{ inputs.flink_line || 'all' }}-${{ inputs.jdk || 'all' }}-${{ inputs.parent_jfr && 'jfr' || 'plain' }}
  cancel-in-progress: true

jobs:
  failure-regressions:
    if: inputs.suite == 'failure-regressions' && (github.repository != 'datafusion-contrib/StreamFusion' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {suite: canonical, line: '1.18', jdk: '11', profiles: 'flink-1.18,canonical-kafka', module: streamfusion-runtime}
          - {suite: canonical, line: '2.2', jdk: '17', profiles: canonical-kafka, module: streamfusion-runtime}
          - {suite: iceberg, line: '2.2', jdk: '17', profiles: iceberg, module: streamfusion-iceberg}
          - {suite: doris, line: '2.2', jdk: '17', profiles: 'doris,doris-it,doris-upstream', module: streamfusion-doris}
          - {suite: paimon-policy, line: '2.2', jdk: '17', profiles: 'paimon,upstream-paimon-compaction', module: streamfusion-paimon}
    env:
      JAVA_TOOL_OPTIONS: '-XX:ActiveProcessorCount=4 -XX:TieredStopAtLevel=1 -XX:ReservedCodeCacheSize=512m -XX:+UseSerialGC'
      SF_KAFKA_INTEGRATION: 'true'
    steps:
      - uses: actions/checkout@v6
      - run: python3 bin/ci-free-disk.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk == '11' && env.CANONICAL_JAVA_11 || env.CANONICAL_JAVA_17 }}
          cache: maven
      - name: Verify the existing native producer
        id: native
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_RUN: ${{ inputs.native_run }}
        run: python3 bin/ci_native_source.py --run "$NATIVE_RUN"
      - uses: actions/download-artifact@v5
        with:
          name: ${{ steps.native.outputs.artifact }}
          run-id: ${{ inputs.native_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/original-native
      - name: Stage the verified native libraries
        run: >-
          python3 bin/ci_native_test_artifact.py --input "$RUNNER_TEMP/original-native"
          --output native/target/debug
      - name: Resolve only this diagnostic's dependencies
        env:
          PROFILES: ${{ matrix.profiles }}
          MODULE: ${{ matrix.module }}
        run: python3 bin/ci-maven-dependencies.py --profile "$PROFILES" --projects "$MODULE" --also-make
      - name: Check canonical timing, physical state and worker cleanup regressions
        if: matrix.suite == 'canonical'
        env:
          SF_CANONICAL_CDS_DIR: ${{ runner.temp }}/canonical-cds
          SF_CANONICAL_REFERENCE_DIR: ${{ runner.temp }}/canonical-references
          PROFILES: ${{ matrix.profiles }}
        run: |
          selection='CanonicalCompositeExtremaMiniBatchJobTest,CanonicalVariableExtremaMiniBatchJobTest,CanonicalRetractingExtremaInitializationTest,CanonicalHiddenExtremaTest,CanonicalGroupArithmeticInitializationTest,CanonicalWorkerProcessTest,SharedFlinkClusterInvocationCleanupTest,SharedFlinkClusterLifecycleTest,FlinkJsonObjectPartialsSqlHarnessTest'
          mvn -B -ntp -P"$PROFILES" -pl streamfusion-runtime -am test \
            -Dnative.build.skip=true -Dsf.protobuf.checkStaleness=true \
            "-Dtest=$selection" -Dsurefire.failIfNoSpecifiedTests=false \
            -Dsf.testForks=4 -Dsf.testReuseForks=false '-Dsf.extraJvmArgs=-Xmx1g'
          if [[ '${{ matrix.line }}' == '2.2' ]]; then
            mvn -B -ntp -P"$PROFILES" -pl streamfusion-runtime -am test \
              -Dnative.build.skip=true -Dsf.protobuf.checkStaleness=true \
              -Dtest=CanonicalKafkaCompletedHandoffJobTest,CanonicalKafkaPipelineFailureJobTest \
              -Dsf.canonical.kafka.fixture.smoke=true -Dsf.canonical.kafka.sink.mode=rescale \
              -Dsurefire.failIfNoSpecifiedTests=false \
              -Dsf.testForks=2 -Dsf.testReuseForks=false '-Dsf.extraJvmArgs=-Xmx1g'
          fi
      - name: Check the real Iceberg branch race and complete original writer configurations
        if: matrix.suite == 'iceberg'
        run: >-
          mvn -B -ntp -Piceberg -pl streamfusion-iceberg -am test
          -Dnative.build.skip=true -Dsf.protobuf.checkStaleness=true
          -Dtest=IcebergDynamicBranchRecoveryTest,NativeIcebergDynamicSinkTest,IcebergDynamicGeneratorTest,IcebergDynamicRoutingTest
          -Dsurefire.failIfNoSpecifiedTests=false -Dsf.testForks=1 '-Dsf.extraJvmArgs=-Xmx1g'
      - name: Check Doris writer startup and released source/sink fixtures
        if: matrix.suite == 'doris'
        env:
          SF_DORIS_NATIVE_BUILD_SKIP: 'true'
        run: bin/doris-suite.sh
      - name: Investigate the released full-compaction changelog failure
        if: matrix.suite == 'paimon-policy'
        run: |
          mvn -B -ntp -f dev/flink-suite/agent/pom.xml package -DskipTests
          python3 - <<'PY'
          from pathlib import Path
          import os
          import shutil
          import subprocess
          import xml.etree.ElementTree as ET
          root = Path.cwd()
          output = Path(os.environ['RUNNER_TEMP']) / 'failure-regressions'
          agent = root / 'dev/flink-suite/agent/target/streamfusion-flink-suite-agent-1.0-SNAPSHOT.jar'
          failed = False
          for trial in range(1, 4):
              for mode in ('stock', 'native'):
                  evidence = output / f'paimon-{trial}-{mode}'
                  evidence.mkdir(parents=True)
                  extra = (f'-Xmx1g -javaagent:{agent} '
                           f'-Dstreamfusion.paimon.compaction.mode={mode} '
                           f'-Dstreamfusion.flink-suite.sql-inventory={evidence / "inventory"} '
                           '-Dstreamfusion.flink-suite.flink-line=2.2')
                  command = ['mvn', '-B', '-ntp', '-Ppaimon,upstream-paimon-compaction',
                             '-pl', 'streamfusion-paimon', '-am', 'test', '-Dnative.build.skip=true',
                             '-Dtest=FullCompactionFileStoreITCase#testIgnoreUpdateBeforeAuditLog',
                             '-Dsurefire.failIfNoSpecifiedTests=false', '-Dsf.testForks=1',
                             '-Dsf.extraJvmArgs=' + extra]
                  result = subprocess.run(command)
                  reports = list((root / 'streamfusion-paimon/target/surefire-reports').glob(
                      'TEST-org.apache.paimon.flink.FullCompactionFileStoreITCase.xml'))
                  if len(reports) != 1:
                      failed = True
                      continue
                  shutil.copy2(reports[0], evidence / reports[0].name)
                  suite = ET.parse(reports[0]).getroot()
                  counts = {key: int(suite.get(key, 0))
                            for key in ('tests', 'failures', 'errors', 'skipped')}
                  print(f'Paimon policy trial {trial} {mode}: {counts}', flush=True)
                  failed |= result.returncode != 0 or counts != dict(tests=1, failures=0, errors=0, skipped=0)
          raise SystemExit(int(failed))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: failure-regressions-${{ matrix.suite }}-${{ matrix.line }}-jdk${{ matrix.jdk }}
          path: |
            **/target/surefire-reports/*.xml
            streamfusion-doris/target/doris-suite/
            streamfusion-doris/target/doris-sql-plans/
            ${{ runner.temp }}/canonical-cds/*.log
            ${{ runner.temp }}/failure-regressions/
          if-no-files-found: error
          retention-days: 7
      - name: Remove diagnostic native libraries and worker caches
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import shutil
          for directory in (Path(os.environ['RUNNER_TEMP']) / 'original-native',
                            Path(os.environ['RUNNER_TEMP']) / 'canonical-cds',
                            Path(os.environ['RUNNER_TEMP']) / 'canonical-references',
                            Path('native/target/debug')):
              if directory.exists():
                  shutil.rmtree(directory)
          PY

  canonical-reference:
    if: inputs.suite == 'canonical-reference' && (github.repository != 'datafusion-contrib/StreamFusion' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        line: ${{ fromJSON(inputs.flink_line == 'all' && '["2.2","1.18"]' || format('["{0}"]', inputs.flink_line)) }}
    env:
      FLINK_PROFILES: ${{ matrix.line == '1.18' && 'flink-1.18,canonical-kafka' || 'canonical-kafka' }}
      JAVA_TOOL_OPTIONS: ${{ inputs.jdk == '11' && '-XX:+UseSerialGC' || '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          filter: blob:none
      - run: python3 bin/ci-free-disk.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.jdk == '11' && env.CANONICAL_JAVA_11 || env.CANONICAL_JAVA_17 }}
          cache: maven
      - name: Verify the existing native producer
        id: native
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_RUN: ${{ inputs.native_run }}
        run: python3 bin/ci_native_source.py --run "$NATIVE_RUN"
      - uses: actions/download-artifact@v5
        with:
          name: ${{ steps.native.outputs.artifact }}
          run-id: ${{ inputs.native_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/original-native
      - name: Stage the canonical native libraries
        run: >-
          python3 bin/ci_native_test_artifact.py --input "$RUNNER_TEMP/original-native"
          --output native/target/debug
      - name: Compile once before paired trials
        run: |
          python3 bin/ci-maven-dependencies.py --profile "$FLINK_PROFILES" --projects streamfusion-runtime --also-make
          mvn -B -ntp -P"$FLINK_PROFILES" -pl streamfusion-runtime -am test-compile \
            -DskipTests=true -Dnative.build.skip=true -Dsf.protobuf.checkStaleness=true
      - name: Compare identical handoffs with independent reference cache lifetimes
        run: >-
          python3 bin/profile-canonical-reference-ci.py --line '${{ matrix.line }}'
          --repetitions 3 --output "$RUNNER_TEMP/reference-comparison"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canonical-reference-flink${{ matrix.line }}-jdk${{ inputs.jdk }}
          path: |
            ${{ runner.temp }}/reference-comparison/summary.json
            ${{ runner.temp }}/reference-comparison/*.log
          if-no-files-found: error
          retention-days: 7
      - name: Remove staged libraries and fixtures
        if: always()
        run: |
          python3 - <<'PY'
          import os, shutil
          from pathlib import Path
          for path in (Path(os.environ['RUNNER_TEMP']) / 'original-native',
                       Path(os.environ['RUNNER_TEMP']) / 'reference-comparison',
                       Path('native/target/debug')):
              if path.exists():
                  shutil.rmtree(path)
          PY

  native-lz4:
    if: inputs.suite == 'native-lz4' && (github.repository != 'datafusion-contrib/StreamFusion' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        flink_line: ${{ fromJSON(inputs.flink_line == 'all' && '["1.18","2.2"]' || format('["{0}"]', inputs.flink_line)) }}
    env:
      FLINK_PROFILES: ${{ matrix.flink_line == '1.18' && 'flink-1.18,bench' || 'bench' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.jdk == '11' && env.CANONICAL_JAVA_11 || env.CANONICAL_JAVA_17 }}
          cache: maven
      - name: Check released native LZ4 and task-local decoder isolation
        run: >-
          mvn -B -ntp -P"$FLINK_PROFILES" -pl streamfusion-runtime -am test
          -Dnative.build.skip=true -Dtest=NativeLz4ShuffleTest
          -Dsurefire.failIfNoSpecifiedTests=false
          -Djunit.jupiter.extensions.autodetection.enabled=false
      - name: Verify the complete codec invocation inventory
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          path = Path('streamfusion-runtime/target/surefire-reports/TEST-tech.streamfusion.NativeLz4ShuffleTest.xml')
          suite = ET.parse(path).getroot()
          assert int(suite.attrib['tests']) == 11, suite.attrib
          assert all(int(suite.attrib.get(key, '0')) == 0 for key in ['failures', 'errors', 'skipped']), suite.attrib
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-lz4-codec-flink${{ matrix.flink_line }}-jdk${{ inputs.jdk }}
          path: streamfusion-runtime/target/surefire-reports/*NativeLz4ShuffleTest*
          if-no-files-found: error
          retention-days: 7

  lake-setup:
    if: inputs.suite == 'lake-setup' && (github.repository != 'datafusion-contrib/StreamFusion' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      FLINK_PROFILES: ${{ inputs.flink_line == '1.18' && 'paimon,flink-1.18' || 'paimon' }}
    steps:
      - uses: actions/checkout@v6
        with:
          filter: blob:none
      - run: python3 bin/ci-free-disk.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.jdk == '11' && env.CANONICAL_JAVA_11 || env.CANONICAL_JAVA_17 }}
          cache: maven
      - name: Verify the existing native producer
        id: native
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_RUN: ${{ inputs.native_run }}
        run: python3 bin/ci_native_source.py --run "$NATIVE_RUN"
      - uses: actions/download-artifact@v5
        with:
          name: ${{ steps.native.outputs.artifact }}
          run-id: ${{ inputs.native_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/original-native
      - name: Stage smaller libraries with identical runtime sections
        run: |
          python3 bin/ci_native_test_artifact.py --input "$RUNNER_TEMP/original-native" \
            --output native/target/debug
      - name: Resolve the complete module dependencies
        run: python3 bin/ci-maven-dependencies.py --profile "$FLINK_PROFILES" --projects streamfusion-paimon --also-make
      - name: Run both complete format configurations
        run: >-
          python3 bin/ci_lake_tests.py --profile "$FLINK_PROFILES" --module streamfusion-paimon
          --summary "$RUNNER_TEMP/lake-test-phases.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lake-setup-${{ inputs.flink_line == '1.18' && '1.18' || '2.2' }}-jdk${{ inputs.jdk }}
          path: |
            ${{ runner.temp }}/lake-test-phases.json
            streamfusion-paimon/target/surefire-reports/*paimon-parquet*
            streamfusion-paimon/target/surefire-reports/*paimon-orc*
            native/target/debug/manifest.json
          if-no-files-found: warn
          retention-days: 7
      - name: Remove probe libraries
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import shutil
          for directory in (Path(os.environ['RUNNER_TEMP']) / 'original-native', Path('native/target/debug')):
              if directory.exists():
                  shutil.rmtree(directory)
          PY

  canonical-setup:
    if: inputs.suite == 'canonical-setup'
    uses: ./.github/workflows/ci-canonical-setup.yml
    with:
      line: ${{ inputs.flink_line == '1.18' && '1.18' || '2.2' }}
      jdk: ${{ inputs.jdk }}
      native_run: ${{ inputs.native_run }}
      parent_jfr: ${{ inputs.parent_jfr }}
      metadata_regression: ${{ inputs.metadata_regression }}
      kafka_rescale_regression: ${{ inputs.kafka_rescale_regression }}

  native:
    name: ${{ inputs.suite == 'native-only' && 'Shared debug native libraries' || 'native' }}
    if: ${{ inputs.suite != 'runtime-hotspots' && inputs.suite != 'canonical-setup' && inputs.suite != 'canonical-reference' && inputs.suite != 'lake-setup' && inputs.suite != 'native-lz4' && inputs.suite != 'failure-regressions' && (github.repository != 'datafusion-contrib/StreamFusion' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v6
      - run: python3 bin/ci-free-disk.py
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          shared-key: debug-jvm
          save-if: ${{ github.repository != 'datafusion-contrib/StreamFusion' || github.ref == 'refs/heads/main' }}
      - run: cargo build --manifest-path native/Cargo.toml --workspace --lib --locked --timings
      - name: Verify native JNI exports
        if: inputs.suite == 'native-only'
        run: python3 bin/check-native-workspace.py --libraries native/target/debug
      - uses: actions/upload-artifact@v4
        if: inputs.suite == 'native-only'
        with:
          name: debug-native-${{ github.sha }}
          path: native/target/debug/libstreamfusion*.so
          compression-level: 1
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: inputs.suite != 'native-only'
        with:
          name: ci-profile-native-${{ github.sha }}
          path: native/target/debug/libstreamfusion.so
          compression-level: 1
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-profile-native-timings-${{ github.sha }}
          path: native/target/cargo-timings
          retention-days: 1
          if-no-files-found: ignore

  paired:
    needs: native
    if: inputs.suite == 'canonical'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        jdk: ['11', '17']
    steps:
      - uses: actions/checkout@v6
      - run: python3 bin/ci-free-disk.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
          cache: maven
      - uses: actions/download-artifact@v5
        with:
          name: ci-profile-native-${{ github.sha }}
          path: native/target/debug
      - name: Compile the unchanged profile cases once
        run: |
          python3 bin/ci-maven-dependencies.py --projects streamfusion-runtime --also-make
          python3 bin/ci-maven-dependencies.py --artifact org.apache.maven.surefire:surefire-junit-platform:3.2.5
          mvn -B -ntp -pl streamfusion-runtime -am test-compile -Dnative.build.skip=true
      - name: Alternate default and startup JVM settings on the same runner
        run: python3 bin/profile-canonical-ci.py --output "$RUNNER_TEMP/ci-startup-profile" --repetitions 3 --cds
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-startup-profile-jdk${{ matrix.jdk }}
          path: |
            ${{ runner.temp }}/ci-startup-profile/
            streamfusion-runtime/target/surefire-reports/*ci-profile*
          retention-days: 7

  runtime:
    needs: native
    if: inputs.suite != 'canonical' && inputs.suite != 'native-only' && inputs.suite != 'runtime-hotspots' && inputs.suite != 'canonical-setup' && inputs.suite != 'canonical-reference' && inputs.suite != 'lake-setup' && inputs.suite != 'native-lz4' && inputs.suite != 'failure-regressions'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.suite == 'runtime-jfr' && '[{"jdk":"17","line":"2.2","jfr":true}]' || inputs.suite == 'runtime-parallel' && '[{"jdk":"11","line":"1.18"},{"jdk":"17","line":"1.18"},{"jdk":"11","line":"2.2"},{"jdk":"17","line":"2.2"},{"jdk":"17","line":"2.2","jfr":true}]' || '[{"jdk":"11","line":"1.18"},{"jdk":"17","line":"1.18"},{"jdk":"11","line":"2.2"},{"jdk":"17","line":"2.2"}]') }}
    steps:
      - uses: actions/checkout@v6
      - run: python3 bin/ci-free-disk.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
          cache: maven
      - uses: actions/download-artifact@v5
        with:
          name: ci-profile-native-${{ github.sha }}
          path: native/target/debug
      - name: Compile the unchanged runtime cases once
        env:
          FLINK_LINE: ${{ matrix.line }}
        run: |
          profile=()
          profile_name=''
          if [[ "$FLINK_LINE" == '1.18' ]]; then
            profile=(-Pflink-1.18)
            profile_name='flink-1.18'
          fi
          python3 bin/ci-maven-dependencies.py --profile "$profile_name" --projects streamfusion-runtime --also-make
          python3 bin/ci-maven-dependencies.py --artifact org.apache.maven.surefire:surefire-junit-platform:3.2.5
          mvn -B -ntp "${profile[@]}" -pl streamfusion-runtime -am test-compile -Dnative.build.skip=true
      - name: Compare runtime JVM compilation with identical assertions
        env:
          PROFILE_SUITE: ${{ inputs.suite }}
          RECORD_JFR: ${{ matrix.jfr }}
          FLINK_LINE: ${{ matrix.line }}
        run: |
          args=(--line "$FLINK_LINE" --repetitions 3)
          if [[ "$RECORD_JFR" == 'true' ]]; then
            args=(--line "$FLINK_LINE" --repetitions 1 --jfr)
          elif [[ "$PROFILE_SUITE" == 'runtime-parallel' ]]; then
            args+=(--parallel)
          fi
          python3 bin/profile-runtime-ci.py --output "$RUNNER_TEMP/runtime-startup-profile" "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-startup-profile-flink${{ matrix.line }}-jdk${{ matrix.jdk }}${{ matrix.jfr && '-jfr' || '' }}
          path: |
            ${{ runner.temp }}/runtime-startup-profile/
            streamfusion-runtime/target/surefire-reports/*runtime-profile*
          retention-days: 7

  hotspots:
    if: inputs.suite == 'runtime-hotspots' && (github.repository != 'datafusion-contrib/StreamFusion' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    concurrency:
      group: ci-hotspot-profile-${{ github.ref }}-${{ inputs.hotspot_mode }}-${{ matrix.line }}-jdk${{ matrix.jdk }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        jdk: ${{ fromJSON((inputs.hotspot_mode == 'parallel' || inputs.hotspot_mode == 'canonical-gc-matrix') && '["11"]' || (inputs.hotspot_mode == 'deeper-runtime' || inputs.hotspot_mode == 'fluss-details' || inputs.hotspot_mode == 'fluss-close' || inputs.hotspot_mode == 'recursive-completion' || inputs.hotspot_mode == 'runtime-regressions' || inputs.hotspot_mode == 'recovery-diagnostics' || inputs.hotspot_mode == 'recovery-transport') && '["17"]' || '["11", "17"]') }}
        line: ${{ fromJSON((inputs.hotspot_mode == 'canonical-gc-matrix' || inputs.hotspot_mode == 'cluster-startup') && (inputs.flink_line == '1.18' && '["1.18"]' || inputs.flink_line == '2.2' && '["2.2"]' || '["2.2", "1.18"]') || '["2.2"]') }}
    steps:
      - uses: actions/checkout@v6
        with:
          filter: blob:none
      - run: python3 bin/ci-free-disk.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.hotspot_mode == 'cluster-startup' && (matrix.jdk == '11' && env.CANONICAL_JAVA_11 || env.CANONICAL_JAVA_17) || matrix.jdk }}
          cache: maven
      - name: Verify native artifact source and completed producer
        id: native
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_RUN: ${{ inputs.native_run }}
        run: python3 bin/ci_native_source.py --run "$NATIVE_RUN"
      - uses: actions/download-artifact@v5
        with:
          name: ${{ steps.native.outputs.artifact }}
          run-id: ${{ inputs.native_run }}
          github-token: ${{ github.token }}
          path: native/target/debug
      - name: Compile the unchanged complete runtime inventory
        env:
          HOTSPOT_MODE: ${{ inputs.hotspot_mode }}
          FLINK_LINE: ${{ matrix.line }}
        run: |
          profile=()
          profile_name=''
          projects='streamfusion-runtime'
          goal='test-compile'
          skip=()
          if [[ "$HOTSPOT_MODE" == 'canonical-parallel' || "$HOTSPOT_MODE" == 'canonical-gc-matrix' ]]; then
            profile=(-Pcanonical-kafka)
            profile_name='canonical-kafka'
            if [[ "$FLINK_LINE" == '1.18' ]]; then
              profile=(-Pflink-1.18,canonical-kafka)
              profile_name='flink-1.18,canonical-kafka'
            fi
          elif [[ "$HOTSPOT_MODE" == 'cluster-startup' && "$FLINK_LINE" == '1.18' ]]; then
            profile=(-Pflink-1.18)
            profile_name='flink-1.18'
          elif [[ "$HOTSPOT_MODE" == 'deeper-runtime' || "$HOTSPOT_MODE" == 'fluss-details' || "$HOTSPOT_MODE" == 'fluss-close' ]]; then
            projects='streamfusion-fluss'
            goal='test'
            skip=(-DskipTests)
          elif [[ "$HOTSPOT_MODE" == 'recovery-diagnostics' ]]; then
            profile=(-Pflink-1.18,ci-diagnostics)
            profile_name='flink-1.18,ci-diagnostics'
            goal='test'
            skip=(-DskipTests)
          elif [[ "$HOTSPOT_MODE" == 'recovery-transport' ]]; then
            profile=(-Pflink-1.18)
            profile_name='flink-1.18'
          fi
          python3 bin/ci-maven-dependencies.py --profile "$profile_name" --projects "$projects" --also-make
          python3 bin/ci-maven-dependencies.py --artifact org.apache.maven.surefire:surefire-junit-platform:3.2.5
          mvn -B -ntp "${profile[@]}" -pl "$projects" -am "$goal" "${skip[@]}" -Dnative.build.skip=true
      - name: Attribute measured slow classes under current CI worker settings
        env:
          HOTSPOT_MODE: ${{ inputs.hotspot_mode }}
          FLINK_LINE: ${{ matrix.line }}
        run: |
          args=(--line 2.2 --repetitions 1 --hotspots)
          if [[ "$HOTSPOT_MODE" == 'parallel' ]]; then
            args=(--line 2.2 --repetitions 2 --slow-mix --parallel)
          elif [[ "$HOTSPOT_MODE" == 'plan-cache' ]]; then
            args=(--line 2.2 --repetitions 2 --plan-cache)
          fi
          nproc
          free -m
          vmstat -w 15 > "$RUNNER_TEMP/runtime-hotspots-vmstat.txt" &
          memory_sampler=$!
          trap 'kill "$memory_sampler" 2>/dev/null || true' EXIT
          if [[ "$HOTSPOT_MODE" == 'deeper-runtime' || "$HOTSPOT_MODE" == 'fluss-details' || "$HOTSPOT_MODE" == 'fluss-close' ]]; then
            (
              while true; do
                date -u
                docker stats --no-stream --format '{{json .}}'
                sleep 15
              done
            ) > "$RUNNER_TEMP/runtime-hotspots-containers.txt" &
            container_sampler=$!
            trap 'kill "$memory_sampler" "$container_sampler" 2>/dev/null || true' EXIT
            if [[ "$HOTSPOT_MODE" == 'deeper-runtime' ]]; then
              python3 bin/profile-ci-details.py --line 2.2 --suite recursive --output "$RUNNER_TEMP/runtime-hotspots/recursive"
            fi
            comparison=()
            if [[ "$HOTSPOT_MODE" == 'fluss-close' ]]; then
              started=$SECONDS
              docker pull zookeeper:3.9.2
              docker pull apache/fluss:1.0.0
              mkdir -p "$RUNNER_TEMP/runtime-hotspots"
              echo "Docker image preparation: $((SECONDS - started)) seconds" > "$RUNNER_TEMP/runtime-hotspots/image-preparation.txt"
              comparison=(--compare-close)
            fi
            python3 bin/profile-ci-details.py --line 2.2 --suite fluss "${comparison[@]}" --output "$RUNNER_TEMP/runtime-hotspots/fluss"
          elif [[ "$HOTSPOT_MODE" == 'runtime-regressions' ]]; then
            python3 bin/profile-ci-details.py --line 2.2 --suite regressions --output "$RUNNER_TEMP/runtime-hotspots/regressions"
          elif [[ "$HOTSPOT_MODE" == 'recursive-completion' ]]; then
            python3 bin/profile-ci-details.py --line 2.2 --suite recursive --compare-completion --output "$RUNNER_TEMP/runtime-hotspots/recursive-completion"
          elif [[ "$HOTSPOT_MODE" == 'recovery-diagnostics' ]]; then
            python3 bin/profile-ci-details.py --line 1.18 --suite recovery --output "$RUNNER_TEMP/runtime-hotspots/recovery"
          elif [[ "$HOTSPOT_MODE" == 'recovery-transport' ]]; then
            python3 bin/profile-ci-details.py --line 1.18 --suite recovery --compare-transport --output "$RUNNER_TEMP/runtime-hotspots/recovery-transport"
          elif [[ "$HOTSPOT_MODE" == 'cluster-startup' ]]; then
            python3 bin/profile-runtime-ci.py --cluster-startup --line "$FLINK_LINE" --repetitions 3 --output "$RUNNER_TEMP/runtime-hotspots"
          elif [[ "$HOTSPOT_MODE" == 'canonical-parallel' ]]; then
            python3 bin/profile-canonical-ci.py --parallel --repetitions 2 --output "$RUNNER_TEMP/runtime-hotspots"
          elif [[ "$HOTSPOT_MODE" == 'canonical-gc' ]]; then
            python3 bin/profile-canonical-ci.py --gc --repetitions 3 --output "$RUNNER_TEMP/runtime-hotspots"
          elif [[ "$HOTSPOT_MODE" == 'canonical-gc-matrix' ]]; then
            python3 bin/profile-canonical-ci.py --gc --worker-mix --line "$FLINK_LINE" --repetitions 2 --output "$RUNNER_TEMP/runtime-hotspots"
          else
            python3 bin/profile-runtime-ci.py "${args[@]}" --output "$RUNNER_TEMP/runtime-hotspots"
          fi
      - name: Verify deferred cluster lifecycle and native cleanup
        if: inputs.hotspot_mode == 'cluster-startup'
        env:
          FLINK_LINE: ${{ matrix.line }}
          JAVA_TOOL_OPTIONS: '-XX:TieredStopAtLevel=1 -XX:ReservedCodeCacheSize=512m'
        run: |
          profile=()
          selection='SharedFlinkClusterLifecycleTest,CanonicalWorkerCacheTest,NativeAllocatorTest,NativeParityValueTest,Utf8WriterReuseTest,TransposeOperatorsTest,FlinkJvmAggregateSqlHarnessTest'
          if [[ "$FLINK_LINE" == '1.18' ]]; then
            profile=(-Pflink-1.18)
            selection+=',FlinkBatchTestContextLifecycleTest'
          fi
          mvn -B -ntp "${profile[@]}" -pl streamfusion-runtime \
            "-Dtest=$selection" -Dsf.testForks=4 -Dsf.testReuseForks=false \
            '-Dsf.extraJvmArgs=-Xmx2g' -Dsurefire.reportNameSuffix=ci-cluster-controls \
            -am test -Dsf.ci.precompiledJava=true -Dnative.build.skip=true \
            -Dsf.protobuf.checkStaleness=true -DskipTests=true -Dsf.runtime.tests.skip=false \
            -Dsurefire.failIfNoSpecifiedTests=false
          python3 - <<'PY'
          from collections import Counter
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          counts = Counter()
          for report in Path('streamfusion-runtime/target/surefire-reports').glob('TEST-*-ci-cluster-controls.xml'):
              suite = ET.parse(report).getroot()
              counts.update({key: int(suite.get(key, 0)) for key in ('tests', 'failures', 'errors', 'skipped')})
          expected = 81 if os.environ['FLINK_LINE'] == '1.18' else 79
          if counts != dict(tests=expected, failures=0, errors=0, skipped=0):
              raise SystemExit(f'Incomplete lifecycle controls: {counts}')
          print(f'All {expected} lifecycle, native cleanup and SQL controls passed')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-hotspots-${{ inputs.hotspot_mode }}-${{ (inputs.hotspot_mode == 'canonical-gc-matrix' || inputs.hotspot_mode == 'cluster-startup') && format('flink{0}-', matrix.line) || '' }}jdk${{ matrix.jdk }}
          path: |
            ${{ runner.temp }}/runtime-hotspots/
            ${{ runner.temp }}/runtime-hotspots-vmstat.txt
            ${{ runner.temp }}/runtime-hotspots-containers.txt
            streamfusion-runtime/target/surefire-reports/*runtime-profile*
            streamfusion-runtime/target/surefire-reports/*ci-cluster-controls*
          retention-days: 7
