name: docs

on:
  push:
    branches: ['**']
    paths:
      - "docs/**"
      - "dev/docs/**"
      - "dev/benchmark_artifacts.py"
      - "dev/test_benchmark_artifacts.py"
      - "dev/flink-suite/render_sql_inventory.py"
      - "dev/flink-suite/sql_inventory.py"
      - "dev/flink-suite/test_render_sql_inventory.py"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.repository != 'datafusion-contrib/StreamFusion' }}

jobs:
  build:
    if: ${{ github.repository != 'datafusion-contrib/StreamFusion' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install 'mkdocs>=1.6,<2' mkdocs-material
      - run: python3 -m unittest discover -s dev/flink-suite -p test_render_sql_inventory.py
      - run: python3 -m unittest discover -s dev -p test_benchmark_artifacts.py
      - run: mkdocs build --strict
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-pages-artifact@v3
        if: github.repository == 'datafusion-contrib/StreamFusion' && github.ref == 'refs/heads/main'
        with:
          path: site

  deploy:
    if: github.repository == 'datafusion-contrib/StreamFusion' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
