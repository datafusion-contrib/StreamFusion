name: Fork CI status

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR to watch; 0 refreshes all open PRs'
        type: number
        default: 0
      watch_until:
        description: 'Continuation deadline in Unix seconds; empty starts a six-hour watch'
        type: string
        default: ''

permissions:
  contents: read
  actions: write
  checks: write
  pull-requests: read

concurrency:
  group: fork-ci-status-${{ github.event.pull_request.number || inputs.pr_number || 'refresh' }}
  cancel-in-progress: false

jobs:
  mirror:
    if: github.repository == 'datafusion-contrib/StreamFusion'
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      # pull_request_target has write permissions: execute only trusted default-branch code.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/scripts/fork-ci-status.py
            /bin/test_fork_ci_status.py
      - name: Test fork result reporting
        run: python3 -m unittest discover -s bin -p test_fork_ci_status.py
      - name: Mirror fork results for the current PR head
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/fork-ci-status.py
