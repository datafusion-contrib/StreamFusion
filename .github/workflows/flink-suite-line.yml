name: Upstream Flink line

on:
  workflow_call:
    inputs:
      line:
        type: string
        required: true
      version:
        type: string
        required: true
      sql_inventory:
        type: boolean
        default: false
      inventory_scope:
        type: string
        default: all

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    env:
      RUST_BACKTRACE: '1'
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    name: Prepare upstream build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      suites: ${{ steps.select.outputs.suites }}
    steps:
      - uses: actions/checkout@v6
      - id: select
        env:
          INVENTORY: ${{ inputs.sql_inventory }}
          SCOPE: ${{ inputs.inventory_scope }}
          FLINK_LINE: ${{ inputs.line }}
        run: python3 dev/flink-suite/suite_matrix.py >> "$GITHUB_OUTPUT"
      - name: Free disk space
        run: python3 bin/ci-free-disk.py
      - uses: actions/setup-java@v4
        id: java
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: dev/flink-suite/agent/pom.xml
      - name: Restore the isolated suite Maven repository and wrapper
        id: maven-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .flink-suite/${{ inputs.line }}/m2
            .flink-suite/${{ inputs.line }}/maven-wrapper
          key: upstream-m2-${{ runner.os }}-${{ runner.arch }}-jdk17-${{ inputs.version }}-${{ hashFiles('**/pom.xml', 'dev/flink-suite/settings.xml', 'bin/flink-suite.sh', 'bin/ci-maven-dependencies.py') }}
          restore-keys: |
            upstream-m2-${{ runner.os }}-${{ runner.arch }}-jdk17-${{ inputs.version }}-
      - name: Restore the compiled pinned Flink checkout
        id: flink-cache
        uses: actions/cache/restore@v4
        with:
          path: .flink-suite/${{ inputs.line }}/flink-${{ inputs.version }}
          key: upstream-classes-ubuntu2404-${{ runner.arch }}-${{ steps.java.outputs.version }}-${{ inputs.version }}-${{ hashFiles('bin/flink-suite.sh', 'dev/flink-suite/settings.xml', '.github/workflows/flink-suite-line.yml') }}
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: debug-jvm
          save-if: false
          workspaces: native
      - name: Build Flink and StreamFusion once
        env:
          FLINK_VERSION: ${{ inputs.version }}
          FLINK_SUITE_BUILD_THREADS: 1C
          FLINK_SUITE_NATIVE_TARGET_DIR: ${{ github.workspace }}/native/target
        run: |
          set -o pipefail
          bin/flink-suite.sh prepare 2>&1 | tee upstream-prepare.log
          test_native="$RUNNER_TEMP/streamfusion-upstream-test-native"
          trap 'rm -rf "$test_native"' EXIT
          python3 bin/ci_native_test_artifact.py \
            --input ".flink-suite/${{ inputs.line }}/streamfusion-source/native/target/debug" \
            --output "$test_native"
          mv "$test_native/"*.so ".flink-suite/${{ inputs.line }}/streamfusion-source/native/target/debug/"
          cp "$test_native/manifest.json" ".flink-suite/${{ inputs.line }}/native-test-libraries.json"
          python3 dev/flink-suite/shared_build.py pack \
            --root ".flink-suite/${{ inputs.line }}" --version "${{ inputs.version }}" \
            --archive upstream-build.tar.zst
      - uses: actions/upload-artifact@v4
        with:
          name: upstream-build-${{ inputs.line }}-${{ github.sha }}
          path: |
            upstream-build.tar.zst
            upstream-build.tar.zst.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-prepare-${{ inputs.line }}-${{ github.sha }}
          path: |
            upstream-prepare.log
            .flink-suite/${{ inputs.line }}/runtime-shards.json
            .flink-suite/${{ inputs.line }}/native-test-libraries.json
          include-hidden-files: true
          retention-days: 7

      - name: Save the isolated suite Maven repository and wrapper
        if: (github.repository != 'datafusion-contrib/StreamFusion' || github.ref == 'refs/heads/main') && steps.maven-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .flink-suite/${{ inputs.line }}/m2
            .flink-suite/${{ inputs.line }}/maven-wrapper
          key: ${{ steps.maven-cache.outputs.cache-primary-key }}
      - name: Save the compiled pinned Flink checkout
        if: (github.repository != 'datafusion-contrib/StreamFusion' || github.ref == 'refs/heads/main') && steps.flink-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .flink-suite/${{ inputs.line }}/flink-${{ inputs.version }}
          key: ${{ steps.flink-cache.outputs.cache-primary-key }}

  upstream-suites:
    name: Integration tests
    needs: prepare
    uses: ./.github/workflows/flink-suite-jobs.yml
    with:
      suites: ${{ needs.prepare.outputs.suites }}
      sql_inventory: ${{ inputs.sql_inventory }}
