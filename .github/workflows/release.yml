name: Release

on:
  push:
    tags:
      - "v*"
      - "dry-run-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Signed release tag to create from main (v<version> or dry-run-v<version>)"
        required: true
        type: string
      resume:
        description: "Resume publication from an existing signed tag on main's history"
        default: false
        type: boolean
      native_run:
        description: "Optional previous canonical release run with both native payloads"
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'datafusion-contrib/StreamFusion'
    name: Validate release tag
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      actions: read
      contents: write
    outputs:
      version: ${{ steps.source.outputs.version }}
      dry_run: ${{ steps.source.outputs.dry_run }}
      tag: ${{ steps.source.outputs.tag }}
      commit: ${{ steps.source.outputs.commit }}
      native_artifacts: ${{ steps.native.outputs.native_artifacts }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none

      - id: source
        name: Select the commit to release
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RESUME: ${{ inputs.resume || false }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            test "$GITHUB_REF" = refs/heads/main
          fi
          if [[ "$RELEASE_TAG" == dry-run-v* ]]; then
            version="${RELEASE_TAG#dry-run-v}"
            dry_run=true
          elif [[ "$RELEASE_TAG" == v* ]]; then
            version="${RELEASE_TAG#v}"
            dry_run=false
          else
            echo "Release tags must start with v or dry-run-v" >&2
            exit 1
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]
          commit="$(git rev-parse HEAD)"
          if [[ "$RESUME" == true ]]; then
            git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            tagged_commit="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
            git merge-base --is-ancestor "$tagged_commit" "$commit"
            git checkout --detach "$tagged_commit"
            commit="$tagged_commit"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dry_run=$dry_run" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Match the tag to Maven and Cargo
        shell: bash
        env:
          VERSION: ${{ steps.source.outputs.version }}
        run: |
          set -euo pipefail
          maven_version="$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)"
          cargo_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' native/Cargo.toml | head -1)"
          loader_version="$(mvn -q -f streamfusion-loader/pom.xml -DforceStdout help:evaluate -Dexpression=project.version)"
          test "$VERSION" = "$maven_version"
          test "$VERSION" = "$cargo_version"
          test "$VERSION" = "$loader_version"

      - name: Sign or verify the manual release tag
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
          VERSION: ${{ steps.source.outputs.version }}
          RELEASE_COMMIT: ${{ steps.source.outputs.commit }}
          RESUME: ${{ inputs.resume || false }}
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$MAVEN_GPG_PRIVATE_KEY" | gpg --batch --import
          key="$(gpg --batch --list-secret-keys --with-colons | awk -F: '$1 == "fpr" { print $10; exit }')"
          test -n "$key"
          passphrase="$RUNNER_TEMP/release-tag-passphrase"
          signer="$RUNNER_TEMP/release-tag-gpg"
          trap 'rm -f "$passphrase" "$signer"' EXIT
          umask 077
          printf '%s' "$MAVEN_GPG_PASSPHRASE" > "$passphrase"
          cat > "$signer" <<'SIGNER'
          #!/usr/bin/env bash
          exec gpg --batch --pinentry-mode loopback --passphrase-file "$RUNNER_TEMP/release-tag-passphrase" "$@"
          SIGNER
          chmod +x "$signer"
          if [[ "$RESUME" == true || -n "$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG")" ]]; then
            git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$RELEASE_COMMIT"
            git verify-tag "$RELEASE_TAG"
          else
            git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              -c user.signingkey="$key" -c gpg.program="$signer" \
              tag -s "$RELEASE_TAG" -m "StreamFusion $VERSION" "$RELEASE_COMMIT"
            git verify-tag "$RELEASE_TAG"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

      - uses: actions/checkout@v6
        if: inputs.native_run
        with:
          ref: ${{ github.sha }}
          path: release-tools
          persist-credentials: false
          sparse-checkout: dev/tools/checks/release_publish.py
          sparse-checkout-cone-mode: false

      - id: native
        if: inputs.native_run
        name: Verify the source of existing native payloads
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_RUN: ${{ inputs.native_run }}
          RESUME: ${{ inputs.resume || false }}
          RELEASE_COMMIT: ${{ steps.source.outputs.commit }}
          VERSION: ${{ steps.source.outputs.version }}
        run: |
          test "$RESUME" = true
          python3 release-tools/dev/tools/checks/release_publish.py validate-native-run \
            "$GITHUB_REPOSITORY" "$NATIVE_RUN" "$RELEASE_COMMIT" "$VERSION"

  linux-native:
    name: Build native payload (Linux x86_64)
    needs: prepare
    if: ${{ !inputs.native_run }}
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          df -h /

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - uses: ./.github/actions/setup-rust

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - uses: Swatinem/rust-cache@v2
        with:
          key: ubuntu-22.04-glibc-2.35
          workspaces: native

      - name: Build release libraries on the runner
        run: bin/build-release.sh --host-only

      - uses: actions/upload-artifact@v4
        with:
          name: native-linux-x86_64-${{ needs.prepare.outputs.version }}
          path: native/target/universal
          if-no-files-found: error
          retention-days: 1

  darwin-native:
    name: Build native payload (macOS Apple Silicon)
    needs: prepare
    if: ${{ !inputs.native_run }}
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          architecture: aarch64
          cache: maven

      - uses: ./.github/actions/setup-rust

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Install native build dependencies
        run: brew install openssl protobuf

      - name: Build release libraries on the runner
        run: bin/build-release.sh --host-only

      - uses: actions/upload-artifact@v4
        with:
          name: native-darwin-aarch64-${{ needs.prepare.outputs.version }}
          path: native/target/universal
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Stage Maven artifacts and GitHub release
    needs: [prepare, linux-native, darwin-native]
    if: >-
      ${{ !cancelled() && needs.prepare.result == 'success'
        && ((needs.linux-native.result == 'success' && needs.darwin-native.result == 'success')
          || needs.prepare.outputs.native_artifacts) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: release
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: release-tools
          persist-credentials: false
          sparse-checkout: dev/tools/checks/release_publish.py
          sparse-checkout-cone-mode: false

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          df -h /

      - uses: actions/download-artifact@v4
        if: ${{ !needs.prepare.outputs.native_artifacts }}
        with:
          pattern: native-*-${{ needs.prepare.outputs.version }}
          path: native/target/universal
          merge-multiple: true

      - name: Download and verify existing native payloads
        if: needs.prepare.outputs.native_artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_ARTIFACTS: ${{ needs.prepare.outputs.native_artifacts }}
        run: |
          python3 release-tools/dev/tools/checks/release_publish.py download-native \
            "$GITHUB_REPOSITORY" "$NATIVE_ARTIFACTS" native/target/universal

      - name: Configure Java, Central credentials, and signing
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Use Maven 3.9 with the tagged Central publishing plugin
        shell: bash
        env:
          MAVEN_VERSION: "3.9.16"
          MAVEN_SHA512: "831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6"
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/apache-maven-$MAVEN_VERSION-bin.tar.gz"
          trap 'rm -f "$archive"' EXIT
          curl --fail --silent --show-error --location --retry 3 \
            "https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/$MAVEN_VERSION/apache-maven-$MAVEN_VERSION-bin.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$MAVEN_SHA512" "$archive" | shasum -a 512 -c
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-$MAVEN_VERSION/bin" >> "$GITHUB_PATH"

      - name: Verify the universal deployment bundle
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mvn --version
          python3 release-tools/dev/tools/checks/release_publish.py attach-runtime-documentation \
            "$GITHUB_REPOSITORY" "$RELEASE_TAG" "$RUNNER_TEMP/runtime-release-docs"
          mvn -B -ntp clean package -Pdist,universal,release,delta,paimon,iceberg,doris -Dgpg.skip=true -DskipTests
          bin/check-artifacts.sh
          python3 release-tools/dev/tools/checks/release_publish.py check-attachments "$VERSION"

      - id: central-status
        name: Check whether this immutable coordinate already exists
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          url="https://repo1.maven.org/maven2/tech/streamfusion/StreamFusion/$VERSION/StreamFusion-$VERSION.pom"
          if curl --fail --silent --head "$url" >/dev/null; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Reject a dry run for an already-published coordinate
        if: needs.prepare.outputs.dry_run == 'true' && steps.central-status.outputs.published == 'true'
        run: |
          echo "${{ needs.prepare.outputs.version }} is already public in Maven Central" >&2
          exit 1

      - name: Upload and validate Maven artifacts without publishing
        if: needs.prepare.outputs.dry_run == 'true'
        run: >-
          mvn -B -ntp deploy -Pdist,universal,release,delta,paimon,iceberg,doris -DskipTests
          -Dcentral.autoPublish=false -Dcentral.waitUntil=validated
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      - name: Publish to Maven Central
        if: needs.prepare.outputs.dry_run != 'true' && steps.central-status.outputs.published != 'true'
        run: mvn -B -ntp deploy -Pdist,universal,release,delta,paimon,iceberg,doris -DskipTests
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      - name: Assemble GitHub release archive
        run: bin/package-release.sh

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          prerelease=()
          draft=()
          title="StreamFusion $VERSION"
          if [[ "$VERSION" == *-* ]]; then
            prerelease+=(--prerelease)
          fi
          if [[ "${{ needs.prepare.outputs.dry_run }}" == true ]]; then
            draft+=(--draft)
            title="$title dry run"
          fi
          assets=(
            target/release/streamfusion-"$VERSION"-bin.tar.gz
            target/release/streamfusion-"$VERSION"-bin.tar.gz.sha256
          )
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --generate-notes \
              --verify-tag \
              "${draft[@]}" \
              "${prerelease[@]}"
          fi
