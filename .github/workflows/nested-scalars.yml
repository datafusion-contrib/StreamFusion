name: Collection release diagnostics for issue 392
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: collection-diagnostics-${{ github.ref }}
  cancel-in-progress: false
jobs:
  diagnostics:
    name: Collection diagnostics (Flink ${{ matrix.line }})
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        line: ['2.2', '1.18']
    env:
      CARGO_BUILD_JOBS: '2'
      MAVEN_OPTS: '-Xmx768m'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: python3 bin/ci-free-disk.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: native
          key: criterion-release
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the production core library
        run: cargo build --manifest-path native/Cargo.toml -p streamfusion --release --no-default-features --features mimalloc
      - name: Install the released profiler
        run: |
          curl --fail --location --retry 3 https://github.com/async-profiler/async-profiler/releases/download/v4.6/async-profiler-4.6-linux-x64.tar.gz --output "$RUNNER_TEMP/profiler.tar.gz"
          echo "1e79ed54d8952889a2e74f993d22ee925e3322460d4f37a2ed95bfb88585da36  $RUNNER_TEMP/profiler.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/profiler.tar.gz" -C "$RUNNER_TEMP"
          sudo sysctl kernel.perf_event_paranoid=1
      - name: Compare actual preceding and current runtimes with stock controls
        run: python3 dev/collection-diagnostics.py '${{ matrix.line }}' d951a83808425f9e7df7c0f6fc3fdb082443885f
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collection-diagnostics-${{ matrix.line }}-${{ github.sha }}
          path: ${{ runner.temp }}/collections-${{ matrix.line }}/
          retention-days: 14
