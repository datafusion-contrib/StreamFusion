syntax = "proto2";

// Proto2 presence is native when read-default-values is false: unset scalars remain NULL like
// Flink. The true setting stays on Flink because proto2 fields may declare arbitrary defaults.
package streamfusion.test;

option java_package = "tech.streamfusion.proto";
option java_multiple_files = true;

message Proto2Row {
  optional int64 id = 1;
  optional string name = 2;
}
