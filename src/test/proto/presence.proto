syntax = "proto3";

// Field shapes with explicit presence, which the planner must decline: Flink force-reads proto3
// primitive defaults even for unset `optional` scalars and oneof arms, while the native decoder
// surfaces explicit absence as NULL.
package streamfusion.test;

option java_package = "tech.streamfusion.proto";
option java_multiple_files = true;

message WithOptionalScalar {
  int64 id = 1;
  optional string maybe = 2;
}

message WithOneof {
  int64 id = 1;
  oneof kind {
    string label = 2;
    int64 number = 3;
  }
}
